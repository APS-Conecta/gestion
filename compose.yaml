# APS Conecta Gestión — core local dev stack (Story 0.1).
# Vanilla Nextcloud 34 + PostgreSQL 18 + Redis, official images only (no fork — AD-1).
# `make up` starts these services ONLY. Provisioning (branding/groups/folders/fixtures)
# is the separate `make seed` pipeline from Story 0.5 onward (AD-2). The office suite
# (Euro-Office — AD-5) is Story 0.2.
#
# Required vars come from .env (created by `make setup`). The ${VAR:?...} guards fail
# fast with a clear message if a required value is missing or empty.
name: apsconecta-gestion

# `nextcloud` and `cron` MUST run the same image off the same three volumes: cron.php loads the
# apps, so it needs custom_apps and themes too, or app-owned jobs fail in a container that looks
# healthy. The anchor below makes that structural instead of a request to stay in step.
# EVERY IMAGE IS PINNED BY DIGEST (#109). The tag stays for readability; the digest is what actually
# resolves. Why, and why a tag moving upstream is not an incident: .github/workflows/image-digests.yml.
# These are INDEX digests (the multi-arch pointer), not per-platform manifests, so arm64 still
# resolves. Refresh with `make images`, which rewrites this file and Dockerfile.dev together. Never
# hand-edit a digest — the whole point is that the bytes here were tested before they were written.
# A clinic's host reboots — for updates, for a power cut, because somebody unplugged it. Without a
# restart policy the stack stays down until a person notices and runs `make up`, and the person who
# would notice is a CESFAM administrator with no reason to know that command. `unless-stopped` and
# not `always`: a stack somebody deliberately stopped stays stopped across a reboot, which is what
# `make down` has to keep meaning.
#
# ACCEPTED COST, named rather than discovered: a dev's laptop now brings the whole stack up on
# boot, Euro-Office's 2.5 GB included. `make down` is the way out and keeps working.
x-nextcloud-base: &nextcloud-base
  restart: unless-stopped
  image: nextcloud:34-apache@sha256:0c74fb931e7e5115c833b3cab8d1eb2a4894ff95cd5fa2e84124ac9d3e1fea09
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - nextcloud_data:/var/www/html
    # Custom code lives in the repo, live-mounted for edit-without-rebuild (Story 0.8, AD-9).
    # These overlay the named volume at the two custom paths the image actually reads
    # (custom_apps = writable apps path; themes = server-side custom themes). No fork (AD-1).
    - ./apps:/var/www/html/custom_apps
    - ./themes:/var/www/html/themes

services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    volumes:
      # postgres:18+ stores data in a major-version subdir; mount the parent, not /data
      # (see docker-library/postgres#1259). Mounting /data errors on boot.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    <<: *nextcloud-base
    # Loopback only — never expose the dev instance on the LAN (global rule 16).
    ports:
      - "127.0.0.1:${HTTP_PORT:?set HTTP_PORT in .env}:80"
    environment:
      # Container-to-container over the compose network by service name (AD-8)
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      # admin is created AND logged straight in by the image's `occ maintenance:install`
      # (first-login listener -> copySkeleton, 62 MB of Nextcloud marketing) before `make up`
      # returns, so phase 15's `config_system_set skeletondirectory ""` is minutes too late for
      # this one account. NC_* is Nextcloud's own system-config override, read before config.php —
      # the only lever that arrives in time. "" , not null (null = inherit the default).
      NC_skeletondirectory: ""
      # The app store is OFF (#163). Env and not a phase: the image's /entrypoint.sh runs
      # `occ upgrade` on any image bump, before a seed can run, and that upgrade re-downloads
      # every enabled app from the store (Updater.php:244) — which is what made the VENDOR pins
      # fiction. "0", not "false": NC_* arrives as a string and getSystemValueBool is a (bool)
      # cast, under which "false" is TRUE. To install one deliberately, pass it back for the one
      # command: `docker compose exec -e NC_appstoreenabled=1 --user www-data nextcloud php occ
      # app:install <id>` — the key is never in config.php, so `occ config:system:set` no-ops.
      NC_appstoreenabled: "0"
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:?set NEXTCLOUD_TRUSTED_DOMAINS in .env}
    # host.docker.internal is ONLY for host<->container; on Linux it needs host-gateway (AD-8).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Background job scheduler ────────────────────────────────────────────────────────────
  # Without this Nextcloud falls back to `ajax`: jobs run only when a user loads a page, so
  # housekeeping stops whenever nobody is browsing (see phase 06-jobs). Deliberately NOT behind a
  # profile — a dev stack whose job behaviour differs from production is where that bug hides.
  # config.php comes from the shared volume and the image already ships the crontab, so the only
  # env here is the store flag: cron.php runs UpdateAvailableNotifications, which is gated on
  # having internet and not on anything this repo sets. Shares x-nextcloud-base, so the volumes
  # cannot drift from `nextcloud`. NOT in the anchor — `<<` is a shallow merge and `nextcloud`
  # defines its own `environment:`, which would drop an anchored one without a word.
  cron:
    <<: *nextcloud-base
    entrypoint: /cron.sh
    environment:
      NC_appstoreenabled: "0"   # same flag, same reason (#163)
    healthcheck:
      # `-f` is required, not cosmetic: /cron.sh does `exec busybox crond -f`, so PID 1's comm is
      # "busybox" and only its argv contains "crond". A bare `pgrep crond` never matches and the
      # container sits permanently unhealthy while cron is in fact running fine.
      test: ["CMD-SHELL", "pgrep -f 'busybox crond' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Office backend: Euro-Office documentserver — Story 0.2, AD-5, promoted by #81 ──
  # Comes up with the stack. It sat behind `profiles: ["eurooffice"]` until #81: measuring showed
  # most of "mandatory" was already true — 12-apps installs the connector and 14-office configures
  # it on EVERY seed — and only this ~2.5 GB container stood between an install and a working
  # editor. `make install` is supposed to yield a clinic that can open a document.
  #
  # ACCEPTED COSTS, named rather than discovered: every `make up` now runs this, including when the
  # work is a CSS edit (`make office-down` is the escape hatch), and the ~8 GB multi-user floor in
  # docs/ARCHITECTURE.md becomes a hard requirement for every clinic host. CI pays it too — the
  # clean boot downloads 2.56 GB it used to skip.
  #
  # Self-contained image (bundles its own PG/Redis/RabbitMQ) — do NOT wire it to the core db/redis.
  eurooffice:
    # No semver release tag is published on GHCR (only `latest` + CI build tags), so the tag says
    # `latest` and the digest says which one. That is the reverse of #81's reading: `latest` sounds
    # like the volatile one, but measured 2026-08-01 it was the ONLY tag here that had not moved in
    # five weeks — while both Docker Official Images had. An unversioned tag is not slow-moving, it
    # is unpredictable: when it does move there is no version to reason about, which is exactly why
    # it needs the digest more than the others, not less.
    image: ghcr.io/euro-office/documentserver:latest@sha256:889e681923d2dcc8bdfb92fe128d10e185fcff880d302b6a0c0c7bf339499290
    restart: unless-stopped
    environment:
      - "JWT_ENABLED=true"
      - "JWT_SECRET=${OFFICE_JWT_SECRET:?set OFFICE_JWT_SECRET in .env}"
      # Required so the doc server may fetch documents over the private compose network (ONLYOFFICE-fork gotcha).
      - "ALLOW_PRIVATE_IP_ADDRESS=true"
    ports:
      # Loopback only (rule 16). Internal port is 80, published on the host as OFFICE_PORT.
      - "127.0.0.1:${OFFICE_PORT:?set OFFICE_PORT in .env}:80"
    # No extra_hosts: every path between these two containers goes by SERVICE NAME (AD-8) —
    # StorageUrl is http://nextcloud/, which is also why phase 14-office adds `nextcloud` to
    # trusted_domains. Add host.docker.internal back only if a callback actually needs it.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # The basemap. Replaces OpenStreetMap's public raster tiles, which answered 403:
  # that server is a P2 best-effort service under a Tile Usage Policy, and their own
  # answer to a blocked application is to run your own or use a third party. This is
  # running our own.
  #
  # One file, /srv/tiles/chile.pmtiles — all of Chile INCLUDING Isla de Pascua and
  # Juan Fernandez (bbox -110,-56,-66.4,-17.5), zoom 0-15, 1.04 GB. The islands cost
  # 4.7 MB of that; a bbox stopping at the mainland silently excludes two comunas that
  # have health facilities. Kept OUT of the repo on purpose: it is a gigabyte of
  # generated data with a refresh schedule, not source.
  tiles:
    image: nginx@sha256:c8497b180665e631ec92a5091125bec5b214f0e2b99409e30653a125b37557da
    restart: unless-stopped
    volumes:
      # Relative, like ./apps and ./themes, because "the core compose carries nothing
      # VPS-specific and no absolute host paths" is an invariant of this repo
      # (docs/ARCHITECTURE.md). The directory is gitignored: it holds a gigabyte of
      # generated data with a refresh schedule, not source.
      - ./tiles:/srv/tiles:ro
      - ./tiles.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback only (rule 16); reached from outside over `tailscale serve`.
      - "127.0.0.1:${TILES_PORT:?set TILES_PORT in .env}:80"
    healthcheck:
      # HEAD the archive itself: nginx being up says nothing about whether the mount
      # carried the file, and an empty basemap is what that failure looks like.
      test: ["CMD-SHELL", "wget -q --spider http://localhost/chile.pmtiles || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  nextcloud_data:
