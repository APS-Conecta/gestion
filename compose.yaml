# APS Conecta Gestión — core local dev stack (Story 0.1).
# Vanilla Nextcloud 33 + PostgreSQL 16 + Redis, official images only (no fork — AD-1).
# `make up` starts these services ONLY. Provisioning (branding/groups/folders/fixtures)
# is the separate `make seed` pipeline from Story 0.5 onward (AD-2). Collabora is Story 0.2.
name: apsconecta-gestion

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:33-apache
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      # Container-to-container over the compose network by service name (AD-8)
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
    # host.docker.internal is ONLY for host<->container; on Linux it needs host-gateway (AD-8).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  nextcloud_data:
