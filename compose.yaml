# APS Conecta Gestión — core local dev stack (Story 0.1).
# Vanilla Nextcloud 34 + PostgreSQL 18 + Redis, official images only (no fork — AD-1).
# `make up` starts these services ONLY. Provisioning (branding/groups/folders/fixtures)
# is the separate `make seed` pipeline from Story 0.5 onward (AD-2). The office suite
# (Euro-Office — AD-5) is Story 0.2.
#
# Required vars come from .env (copy .env.example → .env). The ${VAR:?...} guards fail
# fast with a clear message if a required value is missing or empty.
name: apsconecta-gestion

# `nextcloud` and `cron` MUST run the same image off the same three volumes: cron.php loads the
# apps, so it needs custom_apps and themes too, or app-owned jobs fail in a container that looks
# healthy. That used to be a comment asking the two service blocks to stay in step by hand. It is
# an anchor now, so they cannot drift: there is one definition and both services merge it.
x-nextcloud-base: &nextcloud-base
  image: nextcloud:34-apache
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - nextcloud_data:/var/www/html
    # Custom code lives in the repo, live-mounted for edit-without-rebuild (Story 0.8, AD-9).
    # These overlay the named volume at the two custom paths the image actually reads
    # (custom_apps = writable apps path; themes = server-side custom themes). No fork (AD-1).
    - ./apps:/var/www/html/custom_apps
    - ./themes:/var/www/html/themes

services:
  db:
    image: postgres:18-alpine
    volumes:
      # postgres:18+ stores data in a major-version subdir; mount the parent, not /data
      # (see docker-library/postgres#1259). Mounting /data errors on boot.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    <<: *nextcloud-base
    # Loopback only — never expose the dev instance on the LAN (global rule 16).
    ports:
      - "127.0.0.1:${HTTP_PORT:?set HTTP_PORT in .env}:80"
    environment:
      # Container-to-container over the compose network by service name (AD-8)
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:?set NEXTCLOUD_TRUSTED_DOMAINS in .env}
    # host.docker.internal is ONLY for host<->container; on Linux it needs host-gateway (AD-8).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Background job scheduler ────────────────────────────────────────────────────────────
  # Without this, Nextcloud falls back to `ajax` mode: jobs run only when a user loads a page,
  # one job per request. That is invisible on a dev box someone is clicking, and wrong everywhere
  # else — housekeeping (versions, previews, trash, token cleanup, and later full-text indexing)
  # simply stops whenever nobody is browsing. It also hid an armed `survey_client` monthly report
  # for days: the job was scheduled and had never fired.
  #
  # Deliberately NOT behind a profile. `make up` starts it, so a developer's stack schedules jobs
  # the same way production does — a dev stack whose job behaviour differs from production is
  # exactly where this class of bug hides.
  #
  # Shares x-nextcloud-base with `nextcloud` (see the anchor for why the volumes must match). The
  # image already ships `*/5 * * * * php -f /var/www/html/cron.php` for www-data, and /cron.sh is
  # just `busybox crond -f`. No env is needed — config.php comes from the shared volume.
  cron:
    <<: *nextcloud-base
    entrypoint: /cron.sh
    healthcheck:
      # `-f` is required, not cosmetic: /cron.sh does `exec busybox crond -f`, so PID 1's comm is
      # "busybox" and only its argv contains "crond". A bare `pgrep crond` never matches and the
      # container sits permanently unhealthy while cron is in fact running fine.
      test: ["CMD-SHELL", "pgrep -f 'busybox crond' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Office backend: Euro-Office documentserver (profile: eurooffice) — Story 0.2, AD-5 ──
  # Only comes up under `--profile eurooffice`. Wired via the `eurooffice` connector + shared JWT by
  # `make office-eurooffice`. Self-contained image (bundles its own PG/Redis/RabbitMQ) — do NOT wire
  # it to the core db/redis.
  eurooffice:
    # No semver release tag is published on GHCR (only `latest` + CI build tags) — use `latest`.
    # Pin a digest if byte-reproducibility becomes necessary.
    image: ghcr.io/euro-office/documentserver:latest
    profiles: ["eurooffice"]
    environment:
      - "JWT_ENABLED=true"
      - "JWT_SECRET=${OFFICE_JWT_SECRET:?set OFFICE_JWT_SECRET in .env}"
      # Required so the doc server may fetch documents over the private compose network (ONLYOFFICE-fork gotcha).
      - "ALLOW_PRIVATE_IP_ADDRESS=true"
    ports:
      # Loopback only (rule 16). Internal port is 80, published on the host as OFFICE_PORT.
      - "127.0.0.1:${OFFICE_PORT:?set OFFICE_PORT in .env}:80"
    # No extra_hosts: every path between these two containers goes by SERVICE NAME (AD-8) —
    # StorageUrl is http://nextcloud/, which is also why `make office-eurooffice` adds `nextcloud`
    # to trusted_domains. Add host.docker.internal back only if a callback actually needs it.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  nextcloud_data:
