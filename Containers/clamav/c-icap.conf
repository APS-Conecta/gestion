PidFile /tmp/c-icap.pid
CommandsSocket /tmp/c-icap.ctl
Timeout 120
KeepAliveTimeout 10
StartServers 1
MaxServers 1
ThreadsPerChild 2
MinSpareThreads 1
MaxSpareThreads 2
MaxRequestsPerChild 0
Port 1344
User clamav
Group clamav
TmpDir /tmp
ModulesDir /usr/lib/c_icap
ServicesDir /usr/lib/c_icap
TemplateDir /usr/share/c_icap/templates
LoadMagicFile /etc/c-icap/c-icap.magic
ServerLog /dev/stderr
AccessLog /dev/null
Service antivirus_module virus_scan.so
Module common clamd_mod.so
clamd_mod.ClamdSocket /tmp/clamd.sock
virus_scan.DefaultEngine clamd
virus_scan.SendPercentData 0
virus_scan.Allow204Responces off
virus_scan.PassOnError off
virus_scan.MaxObjectSize 0
ServiceAlias avscan virus_scan?allow204=off&force=on&sizelimit=off&mode=simple
