; Xdebug 3 — step-debugging config for the derived dev image (Story 0.3, AD-10).
; Only the non-default keys are set; the IDE listens on Xdebug 3's default port 9003.
[xdebug]
xdebug.mode = debug
; Only start a debug session when a trigger is present (XDEBUG_TRIGGER / XDEBUG_SESSION) — not every request.
xdebug.start_with_request = trigger
; Xdebug connects OUT to the IDE on the host (container -> host, so host.docker.internal — AD-8).
xdebug.client_host = host.docker.internal
; No xdebug.log on purpose. If you ever need one, do NOT point it at /tmp: Xdebug refuses to open a
; log it does not own when the parent dir is world-writable (drwxrwxrwt), so every root-run PHP
; warns and writes nothing.
