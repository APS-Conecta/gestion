; Xdebug 3 — step-debugging config for the derived dev image (Story 0.3, AD-10).
; v3 renamed everything from v2: mode/start_with_request/client_host/client_port (default 9003, not 9000).
[xdebug]
xdebug.mode = debug
; Only start a debug session when a trigger is present (XDEBUG_TRIGGER / XDEBUG_SESSION) — not every request.
xdebug.start_with_request = trigger
; Xdebug connects OUT to the IDE on the host (container -> host, so host.docker.internal — AD-8).
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false
; No xdebug.log on purpose — see Dockerfile.dev. If you ever need it, do NOT point it at /tmp:
; Xdebug refuses to open a log it does not own when the parent dir is world-writable (drwxrwxrwt),
; which makes every root-run PHP warn and write nothing.
