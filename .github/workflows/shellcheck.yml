name: Shellcheck

on:
  pull_request:
    paths:
      - '**.sh'
  push:
    branches:
      - main
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check Shell
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Shellcheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      with:
        check_together: 'yes'
        # severity: error — the fork's own shell (provisioning/, host/, scripts/) is
        # info/style-heavy BY DESIGN: SC2016 matches bytes in single quotes (the gates'
        # arms), SC2317 renders stub functions test arms define, SC1091 sources phase
        # files shellcheck cannot follow. Zero error-level findings exist; errors red.
        severity: error
      env:
        SHELLCHECK_OPTS: --shell bash
