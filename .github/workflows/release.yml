# The release chain (D4: instalador's tag is the only release identity — one tag, one Release,
# one signed composite package). Tag push runs the whole proven chain in order:
#
#   gates   → INLINE since the hard fork (D-rev 2026-10-19, Stage 3): scripts/validate.sh
#             (upstream's own three — codespell, docker-lint, json-validator) + twig-lint
#             (PHP 8.5 + apcu, upstream's own setup) + the brand and acquisition gates, all
#             against THE TAG TREE (this job's own checkout). contents: read, zero secrets —
#             nothing in the chain pushes git refs anymore. The gates used to ride a
#             workflow_call into the replay chain; the called-workflow graph class that
#             produced b960d8d0/c33884f7/d4a54d87 retires with the call. Upstream's own
#             validator workflows fire on push+PR (ci.yml's gates job rides alongside) but
#             never on tag pushes — this arm is where the tag's bytes are proven.
#   images  → every suite image built from one resolved tag commit, then source-label
#             verification, boot-smoke and a digest manifest. Signing waits for the whole call.
#   package → scripts/package-release.sh: the composite assembly (the suite's tag tree alone —
#             theme, data, sites register and manifest included, and no app bytes in it, #42),
#             the publish record (images.py manifest — same tool
#             and digest format the Images manifest job emits, so the two are diffable), SHA256SUMS, the
#             signify signature over it, the verify-PROOF with the committed installer.pub, and
#             the constants-filled install asset; then gh release create with all five assets.
#
# SECRETS: MINISIGN_SECRET_KEY + MINISIGN_KEY_PASSWORD (package-release.sh's sign: the key
# lands in a 0600 trap-removed temp file, the passphrase rides stdin — the P45 rule: neither
# ever reaches argv or a URL), plus the always-present GITHUB_TOKEN.
#
# ACTIONS SHA-PINNED (upstream's own convention; lint-yaml's zizmor runs over
# .github/workflows on PRs and catches unpinned uses). Untrusted context (the tag name) reaches
# bash only via env:, never inline in run:.
#
# ORDERING (the release ritual, D4/D12): the tag tree is the whole source — the bake's old
# gestion freeze window died with the bake (#42); nothing outside this repo's tag feeds a
# release anymore. The image set
# publishes BEFORE the package is cut, and a PUBLISHED Release's assets never move: the dispatch
# arm below (suite-tag + force-images) exists only to repair a chain that failed BEFORE
# `gh release create` — repairs rebuild from the tag's own content (build-ref = the tag on
# every arm), exactly like a release.
#
# REHEARSAL: tags v0.0.0-ci.N (VERSION set to match on a rehearsal branch) run this same chain
# end-to-end — channel-valid, never mistaken for a release, deletable.
#
# The discipline is proven HERE, by every release's own gates run (validators, twig-lint,
# both gates), before anything builds or signs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      suite-tag:
        description: "Repair arm: re-runs gates + images + package at that tag (a chain that failed before the Release was created)."
        required: true
        type: string
      force-images:
        description: "Images passthrough: re-publish over a fully-present set (a chain that died mid-publish). Never a published, announced release."
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # publishing grants live on the jobs that need them

concurrency:
  group: release-${{ inputs.suite-tag || github.ref_name }}
  cancel-in-progress: false   # a release walk is never cancelled mid-flight; walks for one tag serialize

jobs:
  gates:
    name: Prove the tagged tree before publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read   # the gates arm proves; it moves nothing (the write headroom the callee's pushes needed died with the call)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          persist-credentials: false
          ref: ${{ inputs.suite-tag || github.ref_name }}   # the tag tree — the bytes this chain ships and the builds build
          fetch-depth: 0
      - name: Prove the source and freeze its commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.suite-tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ci\.[0-9]+$ ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "FAIL: a release must be contained in main" >&2; exit 1; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upstream validators I — codespell, docker-lint, json-validator
        run: bash scripts/validate.sh .
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1 (upstream's own pin)
        with:
          php-version: 8.5
          extensions: apcu
          coverage: none
      - name: twig lint (upstream's own command, against the tag tree)
        run: |
          cd php
          composer install
          composer run lint:twig
      # row 270's font-coverage check reads woff2 cmaps — fontTools is a gate dependency, not
      # a nicety: without it the row fails loudly (never passes vacuously), so the chain installs it
      - name: Install full-gate dependencies
        run: |
          python3 -m pip install --quiet fonttools brotli playwright==1.64.1
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd shellcheck
          command -v signify >/dev/null 2>&1 || sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify
      - name: Full local gate, including browser checks
        run: bash scripts/test.sh
      - name: Brand gate
        run: bash scripts/brand-gate.sh .
      - name: Acquisition gate
        run: bash scripts/acquisition-gate.sh .

  images:
    name: Build and publish every suite image
    needs: gates   # a red validator, twig-lint or gate can never move images
    uses: ./.github/workflows/images.yml
    with:
      suite-tag: ${{ inputs.suite-tag || github.ref_name }}
      build-ref: ${{ needs.gates.outputs.sha }}   # the commit proven by the gates
      force: ${{ inputs.force-images || false }}
    permissions:
      contents: read
      packages: write   # headroom for the Images pipeline's pushing jobs

  package:
    name: Package, sign, prove, release
    environment: Release
    needs: [gates, images]   # sign after the complete image set passes its native boot checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # gh release create
      packages: read    # the publish record resolves every digest from the registry
    env:
      RELEASE_SHA: ${{ needs.gates.outputs.sha }}
      RELEASE_TAG: ${{ inputs.suite-tag || github.ref_name }}   # job-level: every step reads the same tag (a step env never crosses the step boundary)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          persist-credentials: false
          ref: ${{ needs.gates.outputs.sha }}   # the proven package source and public key
      - name: Install the signer (the same apt package the clinic verifies with)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd
          # Ubuntu ships the binary as signify-openbsd; package-release.sh (and the clinic's
          # own verificar, whose preparar mirrors this) call the canonical `signify` name —
          # provide it once, at install time (the ci.4 gap: the green install step never
          # created the name the scripts resolve).
          command -v signify >/dev/null 2>&1 || sudo ln -sf "$(command -v signify-openbsd)" /usr/local/bin/signify
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Emit the publish record (the manifest asset)
        run: |
          set -euo pipefail
          # Verify the same source labels and immutable digests as the Images publish record.
          python3 scripts/images.py manifest "$RELEASE_TAG" --sha "$(git rev-parse HEAD)" \
            --ref "$RELEASE_TAG" > "suite-$RELEASE_TAG-manifest.json"
          cat "suite-$RELEASE_TAG-manifest.json"
      - name: Assemble, sign, prove, fill
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/package-release.sh --out dist --manifest "suite-$RELEASE_TAG-manifest.json"
      - name: Create the Release (a published Release's assets never move)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --verify-tag checks existence; bind both lightweight and annotated tags
          # to the commit proven by gates before attaching any signed assets.
          [ -n "${RELEASE_SHA:-}" ] || { echo "FAIL: no proven release SHA" >&2; exit 1; }
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_sha="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$RELEASE_TAG" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled != "" ? peeled : direct }')"
          [ "$tag_sha" = "$RELEASE_SHA" ] \
            || { echo "FAIL: the remote release tag no longer matches the proven commit" >&2; exit 1; }
          files=("dist/apsconecta-$RELEASE_TAG.tar.gz" "dist/SHA256SUMS" "dist/SHA256SUMS.minisig" \
                 "dist/apsconecta-$RELEASE_TAG-install.sh" "dist/apsconecta-install.sh" "suite-$RELEASE_TAG-manifest.json")
          # apsconecta-install.sh — the stable-name alias of the tag's install asset: the
          # runbooks' one-liner resolves through releases/latest/download, so every new
          # Release serves itself without an operator editing the URL (ci.N rehearsals
          # publish --latest=false and never shadow a full release's alias)
          # «APS Conecta Gestión vX.Y.Z» — the product name on the Release the wizard's
          # changelog arms land on (row 270 pins the shape); --generate-notes fills the body
          release_flags=()
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ci\.[0-9]+$ ]]; then
            release_flags+=(--latest=false --prerelease)
          fi
          if gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "APS Conecta Gestión $RELEASE_TAG" "${release_flags[@]}" "${files[@]}"; then
            echo "Release $RELEASE_TAG created with ${#files[@]} assets"
            exit 0
          fi
          # A re-run after a partially-uploaded Release: complete the MISSING assets only —
          # never clobber a published one (the image immutability rule extends to the signed
          # set). Exact-line match: SHA256SUMS is a substring of SHA256SUMS.minisig.
          echo "release $RELEASE_TAG already exists — completing missing assets only (published assets never move)"
          have="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if printf '%s\n' "$have" | grep -qxF "$name"; then
              echo "  present: $name"
            else
              gh release upload "$RELEASE_TAG" "$f"
            fi
          done
