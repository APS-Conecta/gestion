# The release chain (D4: instalador's tag is the only release identity — one tag, one Release,
# one signed composite package). Tag push runs the whole proven chain in order:
#
#   gates   → INLINE since the hard fork (D-rev 2026-10-19, Stage 3): scripts/validate.sh
#             (upstream's own three — codespell, docker-lint, json-validator) + twig-lint
#             (PHP 8.5 + apcu, upstream's own setup) + the brand and acquisition gates, all
#             against THE TAG TREE (this job's own checkout). contents: read, zero secrets —
#             nothing in the chain pushes git refs anymore. The gates used to ride a
#             workflow_call into the replay chain; the called-workflow graph class that
#             produced b960d8d0/c33884f7/d4a54d87 retires with the call. Upstream's own
#             validator workflows fire on push+PR (ci.yml's gates job rides alongside) but
#             never on tag pushes — this arm is where the tag's bytes are proven.
#   images  → the 20-image lockstep (workflow_call): 16 retags copied from OUR previous suite
#             tag (retag-source ours by default — Stage 2's self-referential lockstep)
#             + 4 builds FROM THE TAG (build-ref = the tag: immutable provenance — the exact
#             bytes the gates just proved; the manifest lockstep assert stays as belt-and-
#             braces) + matrix + boot-smoke + manifest. Sign sits behind the WHOLE call: a
#             reusable-workflow job is green only when every job in it is green, and the
#             callee's manifest job already needs matrix and boot-smoke — so nothing is signed
#             before a complete, booted, one-snapshot set exists (the boot-smoke-pins-the-
#             sign-moment rule).
#   spreed  → the Talk fork's refresh (ADR-0020, #145), parallel to images: upstream's newest
#             stable spreed for the tag tree's Nextcloud major, dispatched into
#             APS-Conecta/spreed's own workflow (the app key never leaves an app repo,
#             ADR-0001), waited for bounded, then verified HERE — signature against the tag
#             tree's apps.pub, and bytes: upstream's own tarball minus exactly
#             appinfo/signature.json, at upstream's own commit. A suite release cannot exist
#             without a compatible, verified Talk release.
#   package → scripts/package-release.sh: the composite assembly (the suite's tag tree alone —
#             theme, data, sites register and manifest included, and no app bytes in it, #42),
#             the publish record (retag.sh manifest — same tool
#             and digest format the Images manifest job emits, so the two are diffable), SHA256SUMS, the
#             signify signature over it, the verify-PROOF with the committed installer.pub, and
#             the constants-filled install asset; then gh release create with all five assets.
#
# SECRETS: MINISIGN_SECRET_KEY + MINISIGN_KEY_PASSWORD (package-release.sh's sign: the key
# lands in a 0600 trap-removed temp file, the passphrase rides stdin — the P45 rule: neither
# ever reaches argv or a URL); SPREED_REFRESH_TOKEN (the spreed job's dispatch: a fine-grained
# PAT with Contents read/write on APS-Conecta/spreed alone — the fork's refresh is the one
# cross-repo move in the chain, and the token's scope is that one repo, never the suite's);
# plus the always-present GITHUB_TOKEN.
#
# ACTIONS SHA-PINNED (upstream's own convention; lint-yaml's zizmor runs over
# .github/workflows on PRs and catches unpinned uses). Untrusted context (the tag name) reaches
# bash only via env:, never inline in run:.
#
# ORDERING (the release ritual, D4/D12): the tag tree is the whole source — the bake's old
# gestion freeze window died with the bake (#42); nothing outside this repo's tag feeds a
# release anymore. The image set
# publishes BEFORE the package is cut, and a PUBLISHED Release's assets never move: the dispatch
# arm below (suite-tag + force-images) exists only to repair a chain that failed BEFORE
# `gh release create` — repairs rebuild from the tag's own content (build-ref = the tag on
# every arm), exactly like a release.
#
# REHEARSAL: tags v0.0.0-ci.N (VERSION set to match on a rehearsal branch) run this same chain
# end-to-end — channel-valid, never mistaken for a release, deletable.
#
# The discipline is proven HERE, by every release's own gates run (validators, twig-lint,
# both gates), before anything builds or signs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      suite-tag:
        description: "Repair arm: re-runs gates + images + package at that tag (a chain that failed before the Release was created)."
        required: true
        type: string
      force-images:
        description: "Images passthrough: re-publish over a fully-present set (a chain that died mid-publish). Never a published, announced release."
        required: false
        default: false
        type: boolean
      retag-source:
        description: "The retag source for the images call: ours (default — our previous suite tag, the lockstep; on a tag push this is always the value) | ours:<tag> (a pinned repair). Reaches bash only via env: inside the Images pipeline, never inline in run:."
        required: false
        default: ours
        type: string

permissions:
  contents: write   # the package job creates the Release (gates/images declare tighter job-level grants)

concurrency:
  group: release-${{ inputs.suite-tag || github.ref_name }}
  cancel-in-progress: false   # a release walk is never cancelled mid-flight; walks for one tag serialize

jobs:
  gates:
    name: Gates (validators + brand + acquisition, against the tag tree)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # the gates arm proves; it moves nothing (the write headroom the callee's pushes needed died with the call)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.suite-tag || github.ref_name }}   # the tag tree — the bytes this chain ships and the builds build
      - name: Upstream validators I — codespell, docker-lint, json-validator
        run: bash scripts/validate.sh .
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1 (upstream's own pin)
        with:
          php-version: 8.5
          extensions: apcu
          coverage: none
      - name: twig lint (upstream's own command, against the tag tree)
        run: |
          cd php
          composer install
          composer run lint:twig
      - name: Brand gate
        run: bash scripts/brand-gate.sh .
      - name: Acquisition gate
        run: bash scripts/acquisition-gate.sh .

  images:
    name: Publish the 20-image lockstep set
    needs: gates   # a red validator, twig-lint or gate can never move images
    uses: ./.github/workflows/images.yml
    with:
      suite-tag: ${{ inputs.suite-tag || github.ref_name }}
      build-ref: ${{ inputs.suite-tag || github.ref_name }}   # THE TAG (D-3.4): immutable provenance — the exact bytes the gates just proved; no mid-run ref race
      force: ${{ inputs.force-images || false }}
      retag-source: ${{ inputs.retag-source || 'ours' }}   # ours on every tag push (inputs.* is null there — the || catches it); the repair arm's pinned passthrough
    permissions:
      contents: read
      packages: write   # headroom for the Images pipeline's four pushing jobs

  spreed:
    name: Refresh the Talk fork's signed release
    needs: gates   # ADR-0020, #145: the suite release refreshes APS-Conecta/spreed's App
      # release from upstream's newest stable spreed for THE TAG TREE's Nextcloud major, and
      # the suite Release is not created until that release exists and has proven itself
      # against this tag tree's own apps.pub — a suite release without a compatible Talk
      # release reds here, never on a clinic's first install. The refresh itself runs in the
      # fork's workflow (the app key's only home is its release environment, ADR-0001); this
      # step dispatches it, waits bounded, and verifies what it published.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.suite-tag || github.ref_name }}   # the tag tree: its Nextcloud major, its apps.pub, its resolver
      - name: Install the verifier (the same apt package the clinic verifies with)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd
          command -v signify >/dev/null 2>&1 || sudo ln -sf "$(command -v signify-openbsd)" /usr/local/bin/signify
      - name: The tag tree's Nextcloud major and upstream's expected release
        id: upstream
        run: |
          set -euo pipefail
          python3 scripts/spreed-refresh.py --self-test
          major="$(sed -nE 's/^ENV NEXTCLOUD_VERSION=([0-9]+)\..*/\1/p' Containers/nextcloud/Dockerfile | head -1)"
          [ -n "$major" ] || { echo "FAIL: no NEXTCLOUD_VERSION in the tag tree's Dockerfile" >&2; exit 1; }
          esperada="$(python3 scripts/spreed-refresh.py resolve --nextcloud "$major")" \
            || { echo "FAIL: upstream publishes no stable spreed for Nextcloud $major — the suite cannot ship Talk at this major yet" >&2; exit 1; }
          echo "upstream for Nextcloud $major: $(printf '%s' "$esperada" | cut -f1-2)"
          {
            echo "major=$major"
            echo "version=$(printf '%s' "$esperada" | cut -f1)"
            echo "tag=$(printf '%s' "$esperada" | cut -f2)"
            echo "url=$(printf '%s' "$esperada" | cut -f3)"
            echo "sha256=$(printf '%s' "$esperada" | cut -f4)"
          } >> "$GITHUB_OUTPUT"
      - name: Dispatch the fork's refresh
        env:
          MAJOR: ${{ steps.upstream.outputs.major }}
          GH_TOKEN: ${{ secrets.SPREED_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "FAIL: SPREED_REFRESH_TOKEN is not set — owner-only, once: a fine-grained PAT with Contents: read/write on APS-Conecta/spreed, stored as this repo's SPREED_REFRESH_TOKEN secret (aps/RELEASING.md)." >&2
            exit 1
          fi
          gh api --method POST repos/APS-Conecta/spreed/dispatches \
            -f event_type=refresh-spreed -f "client_payload[nextcloud_major]=$MAJOR"
          echo "dispatched: APS-Conecta/spreed refresh for Nextcloud $MAJOR"
      - name: Wait for the fork's release
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 40); do
            if gh release view "$TAG" --repo APS-Conecta/spreed >/dev/null 2>&1; then
              echo "release $TAG is up (attempt $i)"
              exit 0
            fi
            sleep 30
          done
          echo "FAIL: APS-Conecta/spreed did not publish $TAG within 20 min — see its Actions: https://github.com/APS-Conecta/spreed/actions" >&2
          exit 1
      - name: Verify the release against this tag tree's apps.pub, and against upstream's own bytes
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          URL: ${{ steps.upstream.outputs.url }}
          SHA256: ${{ steps.upstream.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify && cd verify
          gh release download "$TAG" --repo APS-Conecta/spreed
          for esperado in spreed.tar.gz info.xml SHA256SUMS SHA256SUMS.minisig; do
            [ -f "$esperado" ] || { echo "FAIL: the release lacks $esperado" >&2; exit 1; }
          done
          signify -V -p ../apps.pub -m SHA256SUMS -x SHA256SUMS.minisig \
            || { echo "FAIL: the release's signature does not verify against THIS TAG TREE's apps.pub — an app key the suite does not trust signed it" >&2; exit 1; }
          sha256sum -c --quiet SHA256SUMS
          # the pairing, mechanically: what the fork published is upstream's own tarball minus
          # exactly appinfo/signature.json — member for member — and the tag is upstream's commit
          TAG="$TAG" URL="$URL" SHA256="$SHA256" python3 - <<'PY'
          import hashlib, io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"User-Agent": "aps-conecta-instalador"})
          data = urllib.request.urlopen(req, timeout=300).read()
          got = hashlib.sha256(data).hexdigest()
          assert got == os.environ["SHA256"], f"upstream's bytes changed under us: {got}"
          with tarfile.open(fileobj=io.BytesIO(data)) as arriba:
              suyos = {m.name for m in arriba.getmembers()}
          with tarfile.open("spreed.tar.gz") as nuestro:
              nuestros = {m.name for m in nuestro.getmembers()}
          assert nuestros == suyos - {"spreed/appinfo/signature.json"}, \
              "the fork's tarball is not upstream's minus signature.json"
          PY
          gh api "repos/APS-Conecta/spreed/git/ref/tags/$TAG" --jq '.object.sha' > sha-fork
          gh api "repos/nextcloud/spreed/git/ref/tags/$TAG" --jq '.object.sha' > sha-upstream
          [ "$(cat sha-fork)" = "$(cat sha-upstream)" ] \
            || { echo "FAIL: the fork's $TAG is not upstream's commit — the fork's tree is no longer zero-change" >&2; exit 1; }
          echo "verified: $TAG signs against this tree's apps.pub and is upstream's own bytes"

  package:
    name: Package, sign, prove, release
    needs: [gates, images, spreed]   # sign only after a complete, booted, one-snapshot image set exists — and after the Talk fork's release is refreshed and verified (ADR-0020)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # gh release create
      packages: read    # the publish record resolves every digest from the registry
    env:
      RELEASE_TAG: ${{ inputs.suite-tag || github.ref_name }}   # job-level: every step reads the same tag (a step env never crosses the step boundary)
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.suite-tag || github.ref_name }}   # the tag tree: install.sh, installer.pub, VERSION, scripts/
      - name: Install the signer (the same apt package the clinic verifies with)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd
          # Ubuntu ships the binary as signify-openbsd; package-release.sh (and the clinic's
          # own verificar, whose preparar mirrors this) call the canonical `signify` name —
          # provide it once, at install time (the ci.4 gap: the green install step never
          # created the name the scripts resolve).
          command -v signify >/dev/null 2>&1 || sudo ln -sf "$(command -v signify-openbsd)" /usr/local/bin/signify
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Emit the publish record (the manifest asset)
        env:
          # The RETAG job's ONE resolution (D-5), handed up through the images call's
          # workflow_call output: the tag-tree's retag.sh records in retag_source the same
          # spec the walk copied from — the package re-emit must never resolve a second time
          # (a discovery here would race the walk). images is a DIRECT need of this job, so
          # the output resolves; the guard below reds if a future refactor breaks that edge
          # (the B-014 lesson: a transitive need resolves empty, and empty RETAG_SOURCE would
          # silently fall into a bare-'ours' resolution of its own).
          RETAG_SOURCE: ${{ needs.images.outputs.retag-source }}
        run: |
          set -euo pipefail
          # The registry is the truth and digests are immutable, so the digest half of this
          # re-emit equals the Images manifest job's own record (same tool, same format —
          # diffable). built_from is EXACT provenance since the hard fork: this job's checkout
          # IS the tag tree, and the images pipeline built from the same tag (build-ref = the
          # tag, D-3.4) — no remote resolution, no race, nothing left to resolve.
          [ -n "${RETAG_SOURCE:-}" ] || { echo "FAIL: the images job's resolved retag source did not thread — needs.images must stay a direct dependency of this job" >&2; exit 1; }
          RETAG_BUILT_REF="$RELEASE_TAG" RETAG_BUILT_SHA="$(git rev-parse HEAD)" \
            bash scripts/retag.sh manifest "$RELEASE_TAG" > "suite-$RELEASE_TAG-manifest.json"
          cat "suite-$RELEASE_TAG-manifest.json"
      - name: Assemble, sign, prove, fill
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/package-release.sh --out dist --manifest "suite-$RELEASE_TAG-manifest.json"
      - name: Create the Release (a published Release's assets never move)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=("dist/apsconecta-$RELEASE_TAG.tar.gz" "dist/SHA256SUMS" "dist/SHA256SUMS.minisig" \
                 "dist/apsconecta-$RELEASE_TAG-install.sh" "suite-$RELEASE_TAG-manifest.json")
          # «APS Conecta Gestión vX.Y.Z» — the product name on the Release the wizard's
          # changelog arms land on (row 270 pins the shape); --generate-notes fills the body
          if gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "APS Conecta Gestión $RELEASE_TAG" "${files[@]}"; then
            echo "Release $RELEASE_TAG created with ${#files[@]} assets"
            exit 0
          fi
          # A re-run after a partially-uploaded Release: complete the MISSING assets only —
          # never clobber a published one (the retag immutability rule extends to the signed
          # set). Exact-line match: SHA256SUMS is a substring of SHA256SUMS.minisig.
          echo "release $RELEASE_TAG already exists — completing missing assets only (published assets never move)"
          have="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if printf '%s\n' "$have" | grep -qxF "$name"; then
              echo "  present: $name"
            else
              gh release upload "$RELEASE_TAG" "$f"
            fi
          done
