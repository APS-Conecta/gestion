# The release workflow: one tag, one GitHub Release, one machine-readable manifest asset.
# docs.yml's minimal shape + the write permission the upload needs. The tree keeps only the tag;
# the manifest JSON lives on the Release, regenerated per tag — never committed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Emit and attach the release manifest
    runs-on: ubuntu-latest
    # JOB-level env: the Attach step needs RELEASE_TAG too, and a step's env never crosses the
    # step boundary — the first draft defined it inside Emit, and the Attach step expanded it to
    # the empty string (caught in verification).
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # AFTER the FRD's retag job has published ghcr.io/aps-conecta/*:$TAG — the emit resolves
      # the suite digests from the registry; a tag that does not exist yet is unreachable, and
      # the script distinguishes that from 'moved' with its own message. (Recorded in Ordering
      # Constraints: the retag job is the FRD's, the emit is this repo's, and the tag-time order
      # is retag-then-emit.)
      - name: Emit the manifest
        run: bash scripts/release-manifest.sh --emit > "apsconecta-$RELEASE_TAG.manifest.json"
      - name: Fill host_bundle.sha256 with the tag archive's sha256
        run: |
          # The host bundle (S7) is cut from the tagged tree, and the manifest's host_bundle.sha256
          # is the number the INSTALLER.md §2 anchor references — null no more. git archive is
          # deterministic per tag (mtime = commit date, the commit id embedded), so the sha256 is
          # reproducible from any clone of the tag. The ref fetch is insurance: checkout@v4 on a
          # tag event fetches the tag ref, but the manifest asset must never fail on that assumption.
          git fetch --tags --force origin >/dev/null 2>&1 || git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha="$(git archive --format=tar.gz "$RELEASE_TAG" | sha256sum | cut -d' ' -f1)"
          jq --arg sha "$sha" \
             '.host_bundle.sha256 = $sha
              | .host_bundle.note = "the sha256 of the tag archive — the bytes the host bundle (S7) is cut from; the INSTALLER.md §2 anchor"' \
             "apsconecta-$RELEASE_TAG.manifest.json" > manifest.tmp \
            && mv manifest.tmp "apsconecta-$RELEASE_TAG.manifest.json"
          echo "host_bundle.sha256 = $sha"
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            "apsconecta-$RELEASE_TAG.manifest.json" 2>/dev/null \
          || gh release upload "$RELEASE_TAG" "apsconecta-$RELEASE_TAG.manifest.json" --clobber