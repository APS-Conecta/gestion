name: GHCR-PROBE-CALLEE (temporary)
on:
  workflow_call:
jobs:
  census:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -uo pipefail
          fails=""
          for n in aio-postgresql aio-notify-push aio-redis aio-collabora aio-talk aio-talk-recording aio-borgbackup aio-watchtower aio-domaincheck aio-clamav aio-onlyoffice aio-eurooffice aio-imaginary aio-fulltextsearch aio-docker-socket-proxy aio-harp aio-whiteboard ; do
            if docker buildx imagetools create -t "ghcr.io/aps-conecta/$n:census" "ghcr.io/nextcloud-releases/$n:latest" 2>/tmp/e.txt; then
              echo "OK   $n"
            else
              reason=$(grep -oE 'denied[^"]{0,60}|not found|unauthorized[^"]{0,40}|unexpected status[^"]{0,40}' /tmp/e.txt | head -1)
              echo "FAIL $n — $reason"
              fails="$fails $n($reason)"
            fi
          done
          if [ -n "$fails" ]; then echo "::error title=CENSUS::failing:$fails"; exit 1; fi
          echo "CENSUS: all green"
