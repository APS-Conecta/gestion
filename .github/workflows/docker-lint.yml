name: Docker Lint

on:
  pull_request:
    paths:
      - 'Containers/**'
      - 'scripts/validate.sh'
      - 'scripts/ci-tool.sh'
      - '.github/workflows/docker-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'Containers/**'
      - 'scripts/validate.sh'
      - 'scripts/ci-tool.sh'
      - '.github/workflows/docker-lint.yml'

permissions:
  contents: read

concurrency: 
  group: docker-lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest

    name: docker-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint with the shared pinned validator
        run: bash scripts/validate.sh --docker-lint .
