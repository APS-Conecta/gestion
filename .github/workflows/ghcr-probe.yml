name: GHCR-PROBE (temporary)
on:
  workflow_dispatch:
jobs:
  docker-push-leg:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker pull alpine:3.19 >/dev/null
          docker tag alpine:3.19 "ghcr.io/aps-conecta/ghcr-probe:job1"
          docker push "ghcr.io/aps-conecta/ghcr-probe:job1" >/dev/null
          echo "JOB1 docker-push OK"
        env: { ACTOR: "${{ github.actor }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  imagetools-same-org:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    needs: docker-push-leg
    steps:
      - run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "ghcr.io/aps-conecta/ghcr-probe:job2" "ghcr.io/aps-conecta/ghcr-probe:job1"
          echo "JOB2 imagetools same-org OK"
        env: { ACTOR: "${{ github.actor }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  imagetools-cross-org:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    needs: docker-push-leg
    steps:
      - run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "ghcr.io/aps-conecta/ghcr-probe:job3" "ghcr.io/nextcloud-releases/aio-postgresql:latest"
          echo "JOB3 imagetools cross-org OK"
        env: { ACTOR: "${{ github.actor }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
