# Every suite image is built from this tree. The prepare job resolves one source
# commit; every matrix entry, verification and manifest uses that immutable SHA.
name: Images

on:
  workflow_dispatch:
    inputs:
      suite-tag:
        description: "Versioned image tag; use v0.0.0-ci.N for a rehearsal."
        required: true
        type: string
      build-ref:
        description: "Source ref, resolved once before any image is published."
        required: false
        default: main
        type: string
      force:
        description: "Rebuild an unpublished image set; a published Release always refuses."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      suite-tag:
        required: true
        type: string
      build-ref:
        required: false
        default: main
        type: string
      force:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # The reusable caller grants package publication; only the matrix build job uses it.
  packages: write

concurrency:
  group: images-${{ inputs.suite-tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve source, inventory and publication permission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build-ref }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse published tags before any build can push
        id: source
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 scripts/images.py preflight "$SUITE_TAG" "${args[@]}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 scripts/images.py build-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check the frozen source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PostgreSQL loads locally for its tests; other entries publish directly.
      # Euro-Office skips gha caching because its roughly 7 GB base dominates it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: ${{ matrix.database_test }}
          push: ${{ !matrix.database_test }}
          tags: ghcr.io/aps-conecta/${{ matrix.image }}:${{ inputs.suite-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/APS-Conecta/gestion
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: ${{ matrix.cache && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
      - name: The database boots, restarts and restores its dump before publication
        if: matrix.database_test
        run: bash scripts/db-image-test.sh "$IMAGE_REF"
        env:
          IMAGE_REF: ghcr.io/aps-conecta/${{ matrix.image }}:${{ inputs.suite-tag }}
      - name: Push the tested database image without rebuilding it
        if: matrix.database_test
        run: docker push "$IMAGE_REF"
        env:
          IMAGE_REF: ghcr.io/aps-conecta/${{ matrix.image }}:${{ inputs.suite-tag }}
      - name: The published database carries the tested layers
        if: matrix.database_test
        env:
          IMAGE_REF: ghcr.io/aps-conecta/${{ matrix.image }}:${{ inputs.suite-tag }}
        run: |
          set -euo pipefail
          tested="$(docker image inspect "$IMAGE_REF" --format '{{json .RootFS.Layers}}' | jq -c .)"
          pushed="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}' | jq -c .rootfs.diff_ids)"
          if [ "$tested" = null ] || [ "$tested" != "$pushed" ]; then
            echo "FAIL: the published database differs from the tested image" >&2
            exit 1
          fi

  verify:
    name: Verify every published image comes from the resolved source
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check completeness and source/revision labels
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/images.py verify "$SUITE_TAG" --sha "$SOURCE_SHA"

  boot-smoke:
    name: Wizard-boot smoke (interim)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0   # the pull below is the proof manifest-inspect cannot give
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the published mastercontainer and wait for the wizard (bounded)
        run: |
          set -euo pipefail
          # The slice-1 test-bed's verified minimal bring-up shape, verbatim: only :8080 published,
          # apache loopback-only on a high port, SKIP_DOMAIN_VALIDATION with no domain set — a
          # CI-only posture that is never suggested to an operator (D10). The runner is ephemeral,
          # so the docker.sock read-only mount has nothing to harm.
          docker run -d --init --sig-proxy=false --name nextcloud-aio-mastercontainer \
            --restart always \
            --publish 8080:8080 \
            --env SKIP_DOMAIN_VALIDATION=true \
            --env APACHE_PORT=11000 \
            --env APACHE_IP_BINDING=127.0.0.1 \
            --volume nextcloud_aio_mastercontainer:/mnt/docker-aio-config \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            "ghcr.io/aps-conecta/all-in-one:${SUITE_TAG}"
          cleanup() {
            docker rm -f nextcloud-aio-mastercontainer >/dev/null 2>&1 || true
            docker volume rm nextcloud_aio_mastercontainer >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # The wizard serves the one-time initial password on the first GET /setup (slice 1's own
          # verified capture point). Each of 90 attempts has a 5-second request timeout
          # and a 3-second retry delay; the job also has a 10-minute timeout. A cold
          # runner must pull and bring up caddy/php before it can answer.
          for _ in $(seq 90); do
            # Sec-Fetch-Site: none = a browser address-bar navigation. Upstream's cross-origin
            # guard (index.php's Sec-Fetch middleware, #7696-era) 403s 'Forbidden' on any request
            # without a Sec-Fetch-Site of same-origin|none — a bare curl is denied by design.
            # Proven locally against the built image: with the header, /setup serves 200 + the
            # initial-password sentinel (ci.3's diagnosis).
            html="$(curl -sk -H 'Sec-Fetch-Site: none' --max-time 5 https://127.0.0.1:8080/setup || true)"
            case "$html" in
              *'id="initial-password"'*)
                echo "wizard served the initial password within the bound — the published mastercontainer pulls and boots"
                exit 0 ;;
            esac
            sleep 3
          done
          echo "=== the wizard never answered; last mastercontainer logs ===" >&2
          state="$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' nextcloud-aio-mastercontainer 2>/dev/null || echo gone)"
          logs="$(docker logs --tail=40 nextcloud-aio-mastercontainer 2>&1 | tail -40 | tr '\n' '|' || true)"
          echo "::error title=BOOTSMOKE::state=${state} :: logs: ${logs:0:3000}"
          docker logs --tail=50 nextcloud-aio-mastercontainer >&2 || true
          echo "FAIL: ghcr.io/aps-conecta/all-in-one:${SUITE_TAG} never served the wizard on :8080 after 90 bounded attempts" >&2
          exit 1
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}

  manifest:
    name: Publish the digest manifest
    needs: [prepare, verify, boot-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Emit the verified publish record
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_REF: ${{ inputs.build-ref }}
        run: |
          set -euo pipefail
          python3 scripts/images.py manifest "$SUITE_TAG" --sha "$SOURCE_SHA" --ref "$SOURCE_REF" > "suite-$SUITE_TAG-manifest.json"
          cat "suite-$SUITE_TAG-manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-manifest-${{ inputs.suite-tag }}
          path: suite-${{ inputs.suite-tag }}-manifest.json
          if-no-files-found: error
