# S1 — the lockstep image pipeline. 20 images under ghcr.io/aps-conecta/* per suite tag: 17
# registry-side retags of OUR PREVIOUS SUITE TAG (Stage 2, the self-referential lockstep;
# docker buildx imagetools create — seconds, zero runner disk, the
# multi-arch manifest list carried byte-for-byte) + 3 real builds (aio-nextcloud, the apps+theme
# bake that patch 030 slots in; aio-apache, the web front serving the installer's own certificate
# that patch 235 slots in; all-in-one, the mastercontainer reskin that patch 070 slots in). The
# builds are x86-64 only: the suite's documented server requirement.
#
# WHY THE MATRIX GATES THE ANNOUNCE. The wizard resolves every sibling's tag from the mastercontainer's
# own running image tag (%AIO_CHANNEL% -> the channel = the tag the operator ran,
# php/src/Docker/DockerActionManager.php BuildImageName). One tag, twenty images: a missing tag is
# not "one feature down" — the wizard's registry-reachability checks fail the whole start. Existence
# alone is not enough either: the matrix also proves the 17 retagged images faithfully copy their
# RESOLVED source — under ours:<tag> the previous set is immutable, so any mismatch means the walk
# itself erred (the "mixed" concept turns into an integrity proof), and the boot smoke proves
# the pushed mastercontainer actually PULLS and BOOTS —
# manifest-inspect never reads a layer byte, so a broken push is invisible to it.
#
# THE SOURCE IS OURS, RESOLVED ONCE (Stage 2). The 17 retags copy from ghcr.io/aps-conecta/*:<the
# previous suite tag>: the retag job's retag.sh resolves the source
# itself (the newest digest-complete set — git tags ARE the suite-tag list — falling back to the
# recorded aps/BASE.lock bootstrap, else FATAL). Resolution happens exactly ONCE per run: the walk announces
# RETAG_SOURCE_RESOLVED=<spec>, this job's output carries it, the matrix and the manifest jobs
# consume needs.retag.outputs.retag-source, and the workflow_call output hands the same spec to
# the release's package re-emit — no job re-resolves (a second resolution could race a concurrent
# publish of the same tag).
#
# THE BUILD-REF SEAM. THE TAG is what the release chain passes (D-rev 2026-10-19, Stage 3:
# build-ref = the tag — immutable provenance, the exact bytes the gates proved, no mid-run ref
# race; the manifest lockstep assert stays as belt-and-braces). main is the DEFAULT for manual
# dispatches — post-fork main IS the shipped tree (first-class bytes, bake and all), so a
# manual dispatch builds the shipped tree without ceremony; "the unpatched mirror" mode ceased
# to exist with the fork. Only the three BUILD jobs read build-ref; the retag job checks out
# the default branch everywhere. The three build jobs refuse to mix trees: the manifest job
# asserts all three resolved the same commit of build-ref.
#
# IMMUTABILITY. A published tag's digests never move (D12: one distribution, one version). The retag
# job refuses a fully-present set without force, and the builds run needs: retag so the refusal also
# stops THEM — a rejected re-dispatch moves zero bytes (the builds serialize behind the pre-check's
# ~2 min of digest reads; that overlap is not worth the immutability rule). --force exists to repair
# a set that failed verification, or to refresh a throwaway CI tag — never a green, published release.
#
# SECRETS. Only the ephemeral GITHUB_TOKEN (org-linked, packages:write where a job pushes). No PAT
# lives in this repo: the read:packages PAT is the OPERATOR-side install step (R2's decision), never
# CI's. Per-job permissions are least-privilege: write only in the four jobs that push.
#
# ACTIONS ARE SHA-PINNED — upstream's own convention in every workflow it ships, and load-bearing
# here: the mirror's lint-yaml runs zizmor --min-severity medium over .github/workflows on PRs, and
# unpinned uses are exactly what it exists to catch. Bump = resolve the new tag's SHA, change the
# pin, keep the # comment naming the version.
#
# PLACEMENT (post-fork, D-rev 2026-10-19). This workflow lives on main, the default branch —
# dispatch and reusable workflows must exist there for GitHub to run them at all (that is why
# the fork's CI lives on main and not on a tag tree). main is the shipped tree since the hard
# fork — one tree, no mirror, no queue. Upstream's own validators (shellcheck on **.sh,
# lint-yaml/zizmor, json-validator) run on our files too — green on them is a program
# requirement.
#
# The release ordering this workflow serves: the suite tag IS the instalador release tag (D4 —
# gestion's tag ritual retired); the release chain (release.yml) consumes this manifest as its
# channel source, and the manifest job's JSON is the publish-time record — same digest format
# gestion's release-manifest.sh emits, so the two can be diffed against each other.
name: Images

on:
  workflow_dispatch:
    inputs:
      suite-tag:
        description: "The suite tag this lockstep set publishes — the instalador release tag it accompanies (v0.4.0). Channel-valid Docker tag; 'latest*' reserved."
        required: true
        type: string
      build-ref:
        description: "The ref the 3 real builds check out. The release chain passes THE TAG (immutable provenance — the bytes the gates proved). main = the default for manual dispatches (repair/testing; post-fork main IS the shipped tree, bake and all)."
        required: false
        default: main
        type: string
      gestion-ref:
        description: "The gestion ref the bake reads (provisioning/apps + themes/apsconecta at the release content — VENDOR-gated before any byte enters the image). main = release-frozen between the merge and the tag push (the suite-tags-first contract); a pinned SHA for repair runs. Reaches bash only via env:, never inline in run:."
        required: false
        default: main
        type: string
      retag-source:
        description: "Where the 17 registry-side retags copy from. ours = our previous suite tag (the lockstep default — resolved by retag.sh: the newest digest-complete set, else the recorded aps/BASE.lock bootstrap). ours:<tag> = an explicit pin for repair runs. Reaches bash only via env: (RETAG_SOURCE), never inline in run:."
        required: false
        default: ours
        type: string
      force:
        description: "Re-publish over a fully-present set — repair a set that failed verification, or refresh a throwaway CI tag. Never a green release tag."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      suite-tag:
        required: true
        type: string
        description: "See workflow_dispatch."
      build-ref:
        required: false
        default: main
        type: string
        description: "See workflow_dispatch."
      gestion-ref:
        required: false
        default: main
        type: string
        description: "See workflow_dispatch."
      retag-source:
        required: false
        default: ours
        type: string
        description: "See workflow_dispatch."
      force:
        required: false
        default: false
        type: boolean
        description: "See workflow_dispatch."
    outputs:
      retag-source:
        description: "The RESOLVED retag source (ours:<tag>) — the one resolution this run made. The caller's package re-emit threads it into RETAG_SOURCE so the tag-tree's retag.sh records the same spec the walk copied from (no second resolution)."
        value: ${{ jobs.retag.outputs.retag-source }}

permissions:
  contents: read
  # packages: write at WORKFLOW level — not decoration: in a CALLED workflow this block is the
  # CEILING for every nested job (unlike a top-level workflow, where job-level may escalate),
  # so the pushing jobs' own packages: write was silently capped to none and ghcr answered
  # every push with "denied: permission_denied: write_package" (found by the v0.0.0-ci.1
  # rehearsal's retag walk, 2026-10-16). The caller (release.yml's images job) grants
  # contents: read + packages: write — the ceiling chain holds end to end.
  packages: write

concurrency:
  group: images-${{ inputs.suite-tag }}
  cancel-in-progress: false   # a publish walk is never cancelled mid-flight; runs for one tag serialize

jobs:
  retag:
    name: Retag the 17 registry-side images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      # the ONE resolution this run made (D-5) — consumed by matrix/manifest below and handed to
      # the caller through the workflow_call output; nobody re-resolves.
      retag-source: ${{ steps.resolve.outputs.retag-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        # main (default): containers.json — the sibling list's source (parsed, never hardcoded) —
        # and aps/BASE.lock, the bootstrap fallback the source resolution below reads when tag
        # discovery finds no complete set (the sibling names are identical on every ref —
        # 010's auto-include property — and aps/BASE.lock rides the default branch).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry-side retag walk (the source resolved ONCE here — threaded below, never re-derived)
        id: resolve
        # tee, not capture: the walk's stdout (say-notes + the machine-readable announcement)
        # streams live into the Actions log AND lands in the tempfile the output capture greps —
        # a 15-min job must show where it stood if it dies mid-walk.
        run: |
          set -euo pipefail
          log="$(mktemp)"
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bash scripts/retag.sh retag "$SUITE_TAG" "${args[@]}" 2>&1 | tee "$log"
          # the walk announced its resolution (RETAG_SOURCE_RESOLVED=<spec>, retag.sh's D-5 line);
          # capture it into the job output. The spec charset is [A-Za-z0-9._:-] — single-line
          # GITHUB_OUTPUT writes need no delimiters.
          line="$(grep -m1 '^RETAG_SOURCE_RESOLVED=' "$log" || true)"
          [ -n "$line" ] || { echo "::error title=RETAG::the walk announced no resolved source"; exit 1; }
          echo "retag-source=${line#RETAG_SOURCE_RESOLVED=}" >> "$GITHUB_OUTPUT"
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          RETAG_SOURCE: ${{ inputs.retag-source }}
          FORCE: ${{ inputs.force }}

  build-aio-nextcloud:
    name: Build aio-nextcloud (the bake's slot)
    needs: retag   # the immutability pre-check gates the builds too: a refused re-dispatch moves zero bytes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.build-ref }}
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bake the gestion release into the build context (patch 030's build-time half)
        # THE BAKE: aps-bake/ is materialized HERE, before the build — VENDOR-sha256-gated app
        # tarballs unpacked, the eurooffice white-label patches applied (three-outcome, git
        # apply), signature.json dropped for patched apps, the white-label asserts run, the
        # apsconecta theme copied whole (scripts/bake.sh carries every gate; a missing or
        # ungated source fails the build LOUDLY before any push — never a silently unbaked
        # image with a green pipeline). Since the hard fork (D-3.7) the bake runs from THIS
        # JOB'S OWN CHECKOUT — build-ref (the tag or main) carries scripts/bake.sh itself:
        # fork-infra is first-class bytes on every ref now; the instalador sparse clone is
        # gone. The bake source: gestion at the release content (public since ADR-0010; its
        # main is release-frozen between the merge and the tag push — the suite-tags-first
        # contract). fetch+FETCH_HEAD instead of clone --branch so GESTION_REF can be a
        # branch, a tag, or a pinned SHA for repair runs alike.
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse             "https://github.com/APS-Conecta/gestion.git" /tmp/gestion/   # gestion still owns the suite-definition content
          git -C /tmp/gestion sparse-checkout set provisioning/apps themes/apsconecta
          git -C /tmp/gestion fetch --depth 1 origin "$GESTION_REF"
          git -C /tmp/gestion checkout FETCH_HEAD
          bash scripts/bake.sh /tmp/gestion aps-bake/
        env:
          GESTION_REF: ${{ inputs.gestion-ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .   # the Dockerfile copies from repo root (php/, app/, Containers/, aps-bake/ — the bake's materialized output)
          file: Containers/nextcloud/Dockerfile
          push: true
          tags: ghcr.io/aps-conecta/aio-nextcloud:${{ inputs.suite-tag }}
          cache-from: type=gha,scope=aio-nextcloud
          cache-to: type=gha,mode=max,scope=aio-nextcloud

  build-all-in-one:
    name: Build all-in-one (the mastercontainer reskin's slot)
    needs: retag   # same gate as the other build: the pre-check refusal stops the push, not just the retags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.build-ref }}
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containers/mastercontainer/Dockerfile
          push: true
          tags: ghcr.io/aps-conecta/all-in-one:${{ inputs.suite-tag }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

  build-aio-apache:
    name: Build aio-apache (the installer certificate's slot)
    needs: retag   # same gate as the other builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        with:
          ref: ${{ inputs.build-ref }}
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Containers/apache   # the Dockerfile copies its Caddyfile and start.sh from its own directory
          file: Containers/apache/Dockerfile
          push: true
          tags: ghcr.io/aps-conecta/aio-apache:${{ inputs.suite-tag }}
          cache-from: type=gha,scope=aio-apache
          cache-to: type=gha,mode=max,scope=aio-apache

  matrix:
    name: Tag-completeness matrix (the gate)
    needs: [retag, build-aio-nextcloud, build-all-in-one, build-aio-apache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)
        # main (default), NOT build-ref: the sibling NAMES are identical on every ref — 010's
        # generated sed swaps the org prefix and never the names (the auto-include property), and
        # retag.sh parses the basename, so main's containers.json is the one list wherever
        # the build comes from. A fork-side rename of an image is out of scope by locked
        # design (010 is prefix-only); an upstream rename/addition arrives the way every
        # upstream change arrives now: a deliberate merge into main.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3   # freshly-pushed packages are private until the org flips them public
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Matrix — all images present + the copy keyed to the RESOLVED source
        # RETAG_SOURCE carries the RETAG job's one resolution (D-5): the comparator proofs the
        # copy against what the walk actually copied FROM — ours:<tag>: the immutable previous
        # set, a faithful-copy integrity proof.
        run: bash scripts/retag.sh matrix "$SUITE_TAG"
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          RETAG_SOURCE: ${{ needs.retag.outputs.retag-source }}

  boot-smoke:
    name: Wizard-boot smoke (interim)
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3   # the pull below is the proof manifest-inspect cannot give
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the published mastercontainer and wait for the wizard (bounded)
        run: |
          set -euo pipefail
          # The slice-1 test-bed's verified minimal bring-up shape, verbatim: only :8080 published,
          # apache loopback-only on a high port, SKIP_DOMAIN_VALIDATION with no domain set — a
          # CI-only posture that is never suggested to an operator (D10). The runner is ephemeral,
          # so the docker.sock read-only mount has nothing to harm.
          docker run -d --init --sig-proxy=false --name nextcloud-aio-mastercontainer \
            --restart always \
            --publish 8080:8080 \
            --env SKIP_DOMAIN_VALIDATION=true \
            --env APACHE_PORT=11000 \
            --env APACHE_IP_BINDING=127.0.0.1 \
            --volume nextcloud_aio_mastercontainer:/mnt/docker-aio-config \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            "ghcr.io/aps-conecta/all-in-one:${SUITE_TAG}"
          cleanup() {
            docker rm -f nextcloud-aio-mastercontainer >/dev/null 2>&1 || true
            docker volume rm nextcloud_aio_mastercontainer_smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # The wizard serves the one-time initial password on the first GET /setup (slice 1's own
          # verified capture point). Bounded: 5 minutes (90 × ~3 s) — the first boot on a cold runner
          # is pull + caddy/php bring-up, observed ready at ~2.5 min (ci.2's BOOTSMOKE annotation);
          # no unbounded hang anywhere (B-015).
          for _ in $(seq 90); do
            # Sec-Fetch-Site: none = a browser address-bar navigation. Upstream's cross-origin
            # guard (index.php's Sec-Fetch middleware, #7696-era) 403s 'Forbidden' on any request
            # without a Sec-Fetch-Site of same-origin|none — a bare curl is denied by design.
            # Proven locally against the built image: with the header, /setup serves 200 + the
            # initial-password sentinel (ci.3's diagnosis).
            html="$(curl -sk -H 'Sec-Fetch-Site: none' --max-time 5 https://127.0.0.1:8080/setup || true)"
            case "$html" in
              *'id="initial-password"'*)
                echo "wizard served the initial password within the bound — the published mastercontainer pulls and boots"
                exit 0 ;;
            esac
            sleep 3
          done
          echo "=== the wizard never answered; last mastercontainer logs ===" >&2
          state="$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' nextcloud-aio-mastercontainer 2>/dev/null || echo gone)"
          logs="$(docker logs --tail=40 nextcloud-aio-mastercontainer 2>&1 | tail -40 | tr '\n' '|' || true)"
          echo "::error title=BOOTSMOKE::state=${state} :: logs: ${logs:0:3000}"
          docker logs --tail=50 nextcloud-aio-mastercontainer >&2 || true
          echo "FAIL: ghcr.io/aps-conecta/all-in-one:${SUITE_TAG} never served the wizard on :8080 within 2 min" >&2
          exit 1
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}

  manifest:
    name: Digest manifest (the announce)
    # The builds are listed DIRECTLY, not left to transitivity: the needs context only exposes
    # outputs of direct dependencies, so without these entries SHA_A/SHA_B/SHA_C/RETAG_BUILT_SHA
    # below would resolve empty — the built-set lockstep assert would compare '' to '' and stay
    # green for the wrong reason (B-014). retag joins them for the same reason: RETAG_SOURCE
    # below reads needs.retag.outputs.retag-source, and without the direct edge it would resolve
    # empty — cmd_manifest would then fall into a bare-'ours' resolution of its own (a second
    # discovery racing the walk — exactly what D-5 forbids). No ordering change: the builds and
    # retag are already ancestors via matrix.
    needs: [retag, matrix, boot-smoke, build-aio-nextcloud, build-all-in-one, build-aio-apache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream's own pin)   # scripts/retag.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The three builds must come from one tree (lockstep for the built set)
        run: |
          set -euo pipefail
          echo "built from: ${SHA_A:-<empty>} ${SHA_B:-<empty>} ${SHA_C:-<empty>}"
          if [ -z "$SHA_A" ] || [ "$SHA_A" != "$SHA_B" ] || [ "$SHA_A" != "$SHA_C" ]; then
            echo "FAIL: the three builds checked out different commits of '$BUILD_REF' — the ref moved mid-run; re-run the pipeline" >&2
            exit 1
          fi
        env:
          SHA_A: ${{ needs.build-aio-nextcloud.outputs.sha }}
          SHA_B: ${{ needs.build-all-in-one.outputs.sha }}
          SHA_C: ${{ needs.build-aio-apache.outputs.sha }}
          BUILD_REF: ${{ inputs.build-ref }}
      - name: Emit the publish record
        run: |
          set -euo pipefail
          bash scripts/retag.sh manifest "$SUITE_TAG" > "suite-${SUITE_TAG}-manifest.json"
          cat "suite-${SUITE_TAG}-manifest.json"
          {
            echo "### Suite tag \`${SUITE_TAG}\` — publish record"
            echo '```json'
            cat "suite-${SUITE_TAG}-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
          RETAG_SOURCE: ${{ needs.retag.outputs.retag-source }}
          RETAG_BUILT_REF: ${{ inputs.build-ref }}
          RETAG_BUILT_SHA: ${{ needs.build-aio-nextcloud.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-manifest-${{ inputs.suite-tag }}
          path: suite-${{ inputs.suite-tag }}-manifest.json
          if-no-files-found: error
