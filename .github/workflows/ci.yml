# The cheap gate: static checks, seconds, on every PR. The full bring-up is a separate workflow
# (cleanboot.yml) because GitHub filters paths per WORKFLOW, not per job — keeping both here meant
# either running the 3-minute install on docs PRs or leaving it unfiltered and manual (#97).
name: CI

# `push` is limited to main so a PR is not checked twice: a branch push and its pull_request event
# both fired this workflow, and every PR carried two identical Static gate entries.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # org review L5-09: secret scanning at the merge boundary. The pre-commit hook is opt-in
  # (hooksPath) and skips when gitleaks is absent — a contributor without either ships a
  # secret green. Version-pinned binary (the official action needs a license key on org
  # repos; the CLI is the same engine); --redact so the log itself never prints a found
  # secret; --exit-code 1 so a hit is the job's failure, not a warning. The filename
  # blocklist in the pre-commit hook stays as layer two.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # a secret lives wherever history put it, not only at HEAD
      - name: gitleaks 8.18.2 (pinned)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --redact --source "$GITHUB_WORKSPACE" --exit-code 1 --verbose

  static:
    name: Static gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Makefile moved (gestion's dev lifecycle), no .env.example (the rehearsal scaffolding
      # the cleanboot job copies in), no desktop_workspace pin seat (tests/ stayed in gestion).
      # The gate is the script. The signer rides along: package-release's self-test is real
      # crypto over a throwaway keypair, and it is the same apt package the clinic verifies
      # with (D7).
      - name: Install the signer (the same apt package the clinic verifies with; symlinked to the short name it ships under)
        run: sudo apt-get update -qq && sudo apt-get install -y signify-openbsd && sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify
      # The provisionador's browser arms (the Centro pane's tile policy) need Playwright with Chromium and
      # gestion's vendored Leaflet, which this job does not carry. A skipped browser arm is a FAILURE of
      # the self-test, so this job WAIVES it by name — printed in the log as SKIPPED, never counted as a
      # pass. Whoever changes the pane runs the arms locally (a box with playwright and GESTION_TREE).
      - run: bash scripts/test.sh
        env:
          APS_SELFTEST_SIN_NAVEGADOR: "1"

  org-drift:
    name: Org boilerplate drift (org L0-09)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # (org L7-6 idiom, AIO's replay.yml owns the precedent) the compared app repos are
      # PRIVATE — the anonymous clone died with 'could not read Username' on this job's first
      # main run (2026-09-25). The PAT carries the clones on GIT_ASKPASS: never in a URL,
      # never in argv. Empty until the owner adds APS_BOT_PAT (org-level would cover both
      # repos); the step degrades to the loud anonymous failure below instead of a hang.
      APS_BOT_PAT: ${{ secrets.APS_BOT_PAT }}
    steps:
      - uses: actions/checkout@v7
      # The two apps the doctrine matured on, estadistica (compared since its promotion)
      # + the package; epidemiologia joins
      # per-check when its Phase-7 tree lands (the script's own exclusions name
      # their reasons). Depth 1: the gate reads HEAD trees, never history.
      - name: Clone the compared repos
        run: |
          if [ -n "${APS_BOT_PAT:-}" ]; then
            askpass="$(mktemp)"
            {
              echo '#!/bin/sh'
              echo 'case "$1" in *Username*) printf "x-access-token\n" ;; *) printf "%s\n" "$APS_BOT_PAT" ;; esac'
            } >"$askpass"
            chmod 700 "$askpass"
            trap 'rm -f "$askpass"' EXIT
            export GIT_ASKPASS="$askpass"
          fi
          git clone --depth 1 https://github.com/APS-Conecta/gestion.git gestion
          git clone --depth 1 https://github.com/APS-Conecta/territorio.git apps/territorio
          git clone --depth 1 https://github.com/APS-Conecta/farmacia.git apps/farmacia
          git clone --depth 1 https://github.com/APS-Conecta/estadistica.git apps/estadistica
          git clone --depth 1 https://github.com/APS-Conecta/aps-common.git ../aps-common
      - name: Drift gate — phpunit exact, core targets, eslint teeth, aps-sync parity
        run: bash gestion/scripts/check-org-drift.sh apps
