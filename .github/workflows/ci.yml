# The cheap gate: static checks + the brand/acquisition gates, seconds, on every PR and push.
# The full bring-up is a separate workflow
# (cleanboot.yml) because GitHub filters paths per WORKFLOW, not per job — keeping both here meant
# either running the 3-minute install on docs PRs or leaving it unfiltered and manual (#97).
name: CI

# `push` is limited to main so a PR is not checked twice: a branch push and its pull_request event
# both fired this workflow, and every PR carried two identical Static gate entries.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The PR-title gate S2a lost (aps-common#10): Conventional Commits with the instalador
  # scope, in English — the org's language doctrine (#27) says commits AND PR titles are
  # English while issue and UI titles stay Spanish. This session shipped two Spanish PR
  # titles before the rule was written down anywhere (#118); the mechanical half is a
  # regex, restored here, and the language half lives in AGENTS.md's Commits section.
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: The title is feat|fix|docs|chore|test|build|ci|refactor|perf|revert|style, scope optional
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|chore|test|build|ci|refactor|perf|revert|style)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::title '$TITLE' is not a Conventional Commit (English; issue titles are the Spanish ones)"; exit 1; }

  # org review L5-09: secret scanning at the merge boundary. The pre-commit hook is opt-in
  # (hooksPath) and skips when gitleaks is absent — a contributor without either ships a
  # secret green. Version-pinned binary (the official action needs a license key on org
  # repos; the CLI is the same engine); --redact so the log itself never prints a found
  # secret; --exit-code 1 so a hit is the job's failure, not a warning. The filename
  # blocklist in the pre-commit hook stays as layer two.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # a secret lives wherever history put it, not only at HEAD
      - name: Verify and run the pinned gitleaks binary
        run: |
          bash scripts/ci-tool.sh gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" detect --redact --source "$GITHUB_WORKSPACE" --exit-code 1 --verbose

  static:
    name: Static gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Makefile moved (gestion's dev lifecycle).
      # The gate is the script. The signer rides along: package-release's self-test is real
      # crypto over a throwaway keypair, and it is the same apt package the clinic verifies
      # with (D7).
      - name: Install the signer and certificate ACL tool
        run: sudo apt-get update -qq && sudo apt-get install -y signify-openbsd acl php-cli && sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify
      # The provisionador's browser arms (the Centro pane's tile policy) need Playwright with Chromium,
      # which this job does not install. A skipped browser arm is a FAILURE of the self-test, so this
      # job WAIVES it by name — printed in the log as SKIPPED, never counted as a pass. Whoever changes
      # the pane runs the arms locally (a box with playwright).
      - run: bash scripts/test.sh
        env:
          APS_SELFTEST_SIN_NAVEGADOR: "1"

  ip-routing:
    name: Isolated IP routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install namespace-test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 iptables php-cli openssl curl
      - name: Verify container routes with trusted HTTPS and unchanged host policy
        run: sudo bash tests/ip-routing-network.sh --repair
      - name: Build the controller and verify the confined Docker helper
        run: |
          docker build -t aps-ip-routing:test -f Containers/mastercontainer/Dockerfile .
          sudo bash tests/ip-routing-docker.sh aps-ip-routing:test

  # The gates, re-homed with the hard fork (D-rev 2026-10-19, Stage 3): the replay chain that
  # ran them against .aps-replay-tree retired — post-fork main IS the shipped tree, so the
  # brand and acquisition gates assert the checkout directly on every push and PR. The rows
  # are unconditional now (no queue, no skips): a red row is a real regression in the promoted
  # bytes. Upstream's own validators (codespell, docker-lint, json-validator, shellcheck,
  # twig-lint) fire on the same events for free; the release chain carries its own inline
  # gates arm for tag pushes, which these triggers never reach.
  gates:
    name: Brand + acquisition gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # row 270's font-coverage check reads woff2 cmaps — fontTools is a gate dependency, not
      # a nicety: without it the row fails loudly (never passes vacuously), so CI installs it
      - run: python3 -m pip install --quiet fonttools brotli
      - run: bash scripts/brand-gate.sh .
      - run: bash scripts/acquisition-gate.sh .

  # Prove the gates can red (org L7-2), re-homed from the replay chain (D-rev 2026-10-19):
  # the PR arm injects a known regression and asserts the gate EXITS 1 on it — brand-gate had
  # four ledgered instances of arms that could not red (BUGS.md A-005, A-006, A-010, A-011),
  # each fixed ad-hoc because nothing stood beneath the fix. The substrate is the PR merge
  # checkout itself — no replay, no worktree (post-fork the checkout is the shipped tree):
  # Baseline (green), Arm A (revert a 060 sentinel from the gate's own live table), Arm B
  # (re-inject an upstream registry ref into containers.json), Arm D (orphan one
  # spec link name — row 190's subject, #131: one occurrence reverted, row 170 stays green),
  # Arm E (flip a token value in the wizard's generated block — row 270's subject, #49: the
  # block drifts from the ONE token file while every per-surface grep stays green), Arm F
  # (re-insert an entrypoint enable of a policy app — row 280's subject, #155: an absence
  # check whose pattern missed the real `occ app:enable` line shape would stay green), Arm G
  # (drop release.yml's font install — row 270's dependency check, A-040: the tag's chain ran
  # the gate without fontTools while every PR stayed green) — each must red, then revert in
  # place; the job never commits its mutation. PR-only: pushes are already gated by the gates
  # job above.
  gate-red-proof:
    name: Prove the gates can red (org L7-2)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet fonttools brotli   # row 270's font check, same as the gates job
      - name: Baseline — the gate is green before any injection
        run: bash scripts/brand-gate.sh .
      - name: Arm A — revert a 060 sentinel, expect the gate to red
        run: |
          # the target comes from the gate's own live table (--sentinel-pair), so a reworded
          # table re-points the arm instead of the sed silently matching nothing
          IFS='|' read -r f en es < <(bash scripts/brand-gate.sh --sentinel-pair 2)
          grep -qF "$es" "$f" \
            || { echo "ARM A target drifted — sentinel row 2 no longer matches the tree; re-point the arm" >&2; exit 1; }
          sed -i "s#${es}#${en}#" "$f"
          if bash scripts/brand-gate.sh .; then
            echo "ARM A FAILED: the reverted sentinel ($en in $f) did NOT red the brand gate — a vacuous arm, org L7-2's rot class" >&2
            exit 1
          fi
          echo "ARM A green: the reverted sentinel reds the gate"
          # restore by reverting the sed: the job proves red-ability, it never ships the mutation
          sed -i "s#${en}#${es}#" "$f"
      - name: Arm B — re-inject an upstream registry ref, expect the gate to red
        run: |
          json=php/containers.json
          grep -q 'ghcr.io/aps-conecta/' "$json" \
            || { echo "ARM B target drifted — no aps-conecta refs in containers.json" >&2; exit 1; }
          sed -i 's#ghcr.io/aps-conecta/#ghcr.io/nextcloud-releases/#g' "$json"
          if bash scripts/brand-gate.sh .; then
            echo "ARM B FAILED: upstream registry refs in containers.json did NOT red the brand gate" >&2
            exit 1
          fi
          echo "ARM B green: the re-injected registry ref reds the gate"
          sed -i 's#ghcr.io/nextcloud-releases/#ghcr.io/aps-conecta/#g' "$json"
      - name: Arm D — orphan one spec link name, expect the gate to red
        run: |
          # row 190's subject is #131's exact shape: the reskin renamed the containers-page
          # link and ONE spec line stayed behind — row 170 stayed green (another occurrence
          # carries the new name) while the locator matched nothing. The arm reverts exactly
          # one occurrence, so the red it proves is row 190's alone; two occurrences are the
          # drift-guard, fewer would red row 170 too and the proof would misattribute.
          f=php/tests/tests/initial-setup.spec.js
          new="name: 'Abrir APS Conecta Gestión ↗'"
          old="name: 'Abrir su Nextcloud ↗'"
          [ "$(grep -cF "$new" "$f")" -ge 2 ] \
            || { echo "ARM D target drifted — fewer than two occurrences in $f; re-point the arm" >&2; exit 1; }
          sed -i "0,/${new}/s//${old}/" "$f"
          if bash scripts/brand-gate.sh .; then
            echo "ARM D FAILED: the orphaned link name did NOT red the brand gate — row 190 is vacuous" >&2
            exit 1
          fi
          echo "ARM D green: the orphaned link name reds the gate"
          sed -i "0,/${old}/s//${new}/" "$f"
      - name: Arm E — flip a token value in the wizard's generated block, expect the gate to red
        run: |
          # #49's sync row: the wizard's brand-token block is the byte projection of the ONE
          # token file — the arm drifts exactly one value in the block (the file untouched),
          # which is the duplicate-palette shape the row exists to catch: bytes present,
          # projection gone, every per-surface grep still green on its own.
          f=php/public/style.css
          sed -i 's/--aps-violet: #7f21fe;/--aps-violet: #ff00ff;/' "$f"
          grep -qF -- '--aps-violet: #ff00ff;' "$f" \
            || { echo "ARM E target drifted — the generated block no longer carries the violet token; re-point the arm" >&2; exit 1; }
          if bash scripts/brand-gate.sh .; then
            echo "ARM E FAILED: a drifted wizard token value did NOT red the brand gate — row 270's projection check is vacuous" >&2
            exit 1
          fi
          echo "ARM E green: the drifted token value reds the gate"
          sed -i 's/--aps-violet: #ff00ff;/--aps-violet: #7f21fe;/' "$f"
      - name: Arm F — re-insert an entrypoint enable of a policy app, expect the gate to red
        run: |
          # row 280 reads its ids from provisioning/app-policy.sh: an entrypoint line enabling
          # support (a POLICY_ADMIN_ONLY app) on every boot, before the log setup, must red it
          f=Containers/nextcloud/entrypoint.sh
          grep -qx '# Adjusting log files to be stored on a volume' "$f" \
            || { echo "ARM F target drifted — the log setup's comment is not in $f; re-point the arm" >&2; exit 1; }
          ( . provisioning/app-policy.sh && case " $POLICY_ADMIN_ONLY " in *" support "*) ;; *) exit 1 ;; esac ) \
            || { echo "ARM F target drifted — support is not in POLICY_ADMIN_ONLY; re-point the arm" >&2; exit 1; }
          sed -i '/^# Adjusting log files to be stored on a volume$/i php /var/www/html/occ app:enable support' "$f"
          if bash scripts/brand-gate.sh .; then
            echo "ARM F FAILED: an entrypoint enable of support did NOT red the brand gate — row 280 is vacuous" >&2
            exit 1
          fi
          echo "ARM F green: the re-inserted enable reds the gate"
          sed -i '/^php \/var\/www\/html\/occ app:enable support$/d' "$f"
      - name: Arm G — drop release.yml's font install, expect the gate to red
        run: |
          # row 270's dependency check walks every job that runs the gate: the release's gates
          # job without its fontTools install is the A-040 shape — the tag's own chain red
          f=.github/workflows/release.yml
          python3 - "$f" <<'PYTHON'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          pattern = r'^ +(?:- run: )?python3 -m pip install .*fonttools.*brotli.*$'
          changed, count = re.subn(pattern, '', text, flags=re.M)
          if count != 1:
              sys.exit("ARM G target drifted: expected exactly one release font-dependency install")
          path.write_text(changed)
          PYTHON
          if bash scripts/brand-gate.sh .; then
            echo "ARM G FAILED: release.yml's gates job without the font install did NOT red the brand gate — row 270's dependency check is vacuous" >&2
            exit 1
          fi
          echo "ARM G green: the dropped install reds the gate"
          git checkout -- "$f"
