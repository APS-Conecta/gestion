            --data-urlencode bypass_container_update=1 https://127.0.0.1:8080/api/docker/start)"
          [ "$code" = 200 ]
          sudo python3 - "$result" <<'PYRESULT'
          import json, pathlib, re, sys
          markers = re.findall(r'<!-- aps-start-result:(.*?) -->', pathlib.Path(sys.argv[1]).read_text())
          assert len(markers) == 1, 'the start stream must finish with one result'
          result = json.loads(markers[0])
          assert result['status'] == 'error' and result['message'], 'a failed configuration write must report its error'
          print('PASS: HTTP 200 carries the real terminal error')
          PYRESULT
          docker exec "$master" rmdir "$config.tmp"
          trap - EXIT
          [ "$(docker exec "$master" sha256sum "$config")" = "$before" ]
          echo 'PASS: the failure left the existing wizard configuration intact'
