      - name: Staff chat and library sharing work over public suite HTTPS
        run: |
          set -euo pipefail
          cd /opt/aps-conecta/instalador
          source scripts/env.sh
          export SUITE_CA="$RUNNER_TEMP/ca.crt"
          suite_url_resolve
          # Stored chat alone cannot certify the current signaling connection.
          sudo bash scripts/talk-smoke.sh
          # Recording remains off on these four-core runners; its measured policy belongs to #189.
          sudo python3 - "$SUITE_URL" "$SUITE_CA" "$PWD/sites/$SITE/site.sh" <<'PYCHAT'
          import base64, csv, json, ssl, subprocess, sys, urllib.parse, urllib.request, uuid

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          stage = 'reading the protected staff credentials'
          token = None
          failure = None
          try:
              with open('/opt/aps-conecta/credentials.txt', encoding='utf-8', newline='') as stream:
                  rows = list(csv.reader(stream, delimiter=';'))
              credentials = {}
              for user in ('beto.prueba', 'carla.chat', 'jefe.some'):
                  matches = [row for row in rows if len(row) > 2 and row[0] == user]
                  assert len(matches) == 1 and matches[0][2]
                  credentials[user] = matches[0][2]
              opener = urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=sys.argv[2])),
                  RejectRedirects())
              stage = 'checking the declared and installed library grants'
              acl_rows = subprocess.check_output(
                  ['bash', '-c', 'source "$1"; printf "%s\\n" "${SITE_ACL[@]}"', 'sh', sys.argv[3]],
                  text=True).splitlines()
              profiles = {'': 1, 'read share': 17, 'read write delete share': 31}
              declared = {}
              for row in acl_rows:
                  mount, group, words = row.split('|', 2)
                  declared.setdefault(mount, {})[group] = profiles[words]
              inventory = json.loads(subprocess.check_output([
                  'docker', 'exec', '--user', 'www-data', 'aps-conecta-nextcloud',
                  'php', '/var/www/html/occ', 'groupfolders:list', '--output=json']))
              folders = inventory.values() if isinstance(inventory, dict) else inventory
              installed = {(row.get('mountPoint') or row.get('mount_point')): row.get('groups_list') or {}
                           for row in folders}
              assert declared and all(installed.get(mount) == groups for mount, groups in declared.items())
              for user in ('beto.prueba', 'jefe.some'):
                  info = json.loads(subprocess.check_output([
                      'docker', 'exec', '--user', 'www-data', 'aps-conecta-nextcloud',
                      'php', '/var/www/html/occ', 'user:info', user, '--output=json']))
                  assert 'admin' not in info['groups']
                  assert ('cat-jefaturas' in info['groups']) == (user == 'jefe.some')
              base = sys.argv[1] + '/ocs/v2.php/apps/'

              def api(method, path, user, expected, fields=None, app='spreed'):
                  authorization = base64.b64encode((user + ':' + credentials[user]).encode()).decode('ascii')
                  headers = {'Authorization': 'Basic ' + authorization, 'OCS-APIRequest': 'true',
                             'Accept': 'application/json'}
                  data = None
                  if fields is not None:
                      headers['Content-Type'] = 'application/x-www-form-urlencoded'
                      data = urllib.parse.urlencode(fields).encode()
                  request = urllib.request.Request(base + app + '/api/' + path, data=data, headers=headers, method=method)
                  with opener.open(request, timeout=30) as response:
                      assert response.status == expected
                      result = json.load(response)['ocs']
                  assert result['meta']['status'] == 'ok' and result['meta']['statuscode'] == expected
                  return result['data']

              stage = 'creating the disposable group conversation'
              room_name = 'APS Conecta CI ' + uuid.uuid4().hex
              room = api('POST', 'v4/room', 'beto.prueba', 201, {'roomType': 2, 'roomName': room_name})
              token = room['token']
              assert isinstance(token, str) and token and room['name'] == room_name and room['type'] == 2
              room_path = 'v4/room/' + urllib.parse.quote(token, safe='')
              chat_path = 'v1/chat/' + urllib.parse.quote(token, safe='')
              stage = 'adding the other ordinary staff member'
              api('POST', room_path + '/participants', 'beto.prueba', 200,
                  {'newParticipant': 'carla.chat', 'source': 'users'})
              stage = 'posting the staff message'
              text = 'APS Conecta chat acceptance ' + uuid.uuid4().hex
              posted = api('POST', chat_path, 'beto.prueba', 201, {'message': text})
              message_id = posted['id']
              assert type(message_id) is int and message_id > 0
              stage = 'reading the exact message as the other staff member'
              query = urllib.parse.urlencode({'lookIntoFuture': 0, 'limit': 100, 'lastKnownMessageId': 0,
                  'setReadMarker': 0, 'noStatusUpdate': 1})
              messages = api('GET', chat_path + '?' + query, 'carla.chat', 200)
              assert isinstance(messages, list) and any(
                  message.get('id') == message_id and message.get('token') == token and
                  message.get('actorType') == 'users' and message.get('actorId') == 'beto.prueba' and
                  message.get('messageType') == 'comment' and message.get('systemMessage') == '' and
                  message.get('message') == text for message in messages)
              stage = 'adding the library owning-group member'
              api('POST', room_path + '/participants', 'beto.prueba', 200,
                  {'newParticipant': 'jefe.some', 'source': 'users'})
              library = '/Transversal/LÉEME — Convenciones.md'
              fields = {'path': library, 'shareType': 10, 'shareWith': token, 'permissions': 1}
              stage = 'preserving staff read-only access to the library'
              try:
                  api('POST', 'v1/shares', 'beto.prueba', 200, fields, app='files_sharing')
              except urllib.error.HTTPError as error:
                  assert error.code == 403
                  assert json.load(error)['ocs']['meta']['statuscode'] == 403
              else:
                  raise AssertionError('Read-only staff unexpectedly reshared the library document')
              stage = 'sharing the seeded library document as its owning-group member'
              share = api('POST', 'v1/shares', 'jefe.some', 200, fields, app='files_sharing')
              assert int(share['share_type']) == 10 and share['share_with'] == token
              assert int(share['permissions']) == 1
              stage = 'reading the native file attachment as the other staff member'
              messages = api('GET', chat_path + '?' + query, 'carla.chat', 200)
              assert isinstance(messages, list) and any(
                  message.get('token') == token and message.get('actorType') == 'users' and
                  message.get('actorId') == 'jefe.some' and
                  isinstance(message.get('messageParameters'), dict) and any(
                      isinstance(value, dict) and value.get('type') == 'file' and
                      str(value.get('id')) == str(share['file_source']) and
                      value.get('name') == 'LÉEME — Convenciones.md'
                      for value in message.get('messageParameters', {}).values())
                  for message in messages)
          except Exception:
              failure = 'FAIL: staff communication acceptance failed while ' + stage
          finally:
              if isinstance(token, str) and token:
                  try:
                      api('DELETE', 'v4/room/' + urllib.parse.quote(token, safe=''), 'beto.prueba', 200)
                  except Exception:
                      print('FAIL: the creator could not remove its disposable conversation', file=sys.stderr)
                      failure = failure or 'FAIL: staff chat cleanup failed'
          if failure:
              print(failure, file=sys.stderr)
              sys.exit(1)
          print('PASS: ordinary staff chat text round-trips through the public HTTPS v4 room and v1 chat APIs')
          print('PASS: declared library grants match the instance and its non-admin owning member shares a file into Talk')
          print('PASS: the creator removed its disposable conversation')
          PYCHAT
      - name: The wizard reports a terminal error when its configuration cannot be written
