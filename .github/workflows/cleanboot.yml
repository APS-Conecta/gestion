          sudo test -f /opt/aps-conecta/apps.lock.json || { echo "FAIL: no apps lock after the install" >&2; exit 1; }
          read -r tag version sha <<< "$(sudo python3 -c 'import json; a = json.load(open("/opt/aps-conecta/apps.lock.json"))["apps"]["totem"]; print(a["tag"], a["version"], a["sha256"])')"
          echo "lock: totem $tag ($version)"
          [ "${tag#v}" = "$version" ] || { echo "FAIL: the lock's tag and version disagree" >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "FAIL: totem lock does not name a stable release: $version" >&2; exit 1; }
          got="$(occ config:app:get totem installed_version)"
          [ "$got" = "$version" ] || { echo "FAIL: the instance runs totem $got, the lock names $version" >&2; exit 1; }
          sudo test -f "/opt/aps-conecta/apps/totem/$tag.tar.gz" || { echo "FAIL: the locked tarball is not in the store" >&2; exit 1; }
          echo "$sha  /opt/aps-conecta/apps/totem/$tag.tar.gz" | sudo sha256sum --check - \
