            || { echo 'FAIL: refreshing the image theme changed the establishment CSS' >&2; exit 1; }
          echo 'PASS: a warm restart refreshes antivirus messages and preserves establishment CSS'
          [ "$(occ config:app:get eurooffice enabled)" = yes ] \
            || { echo "FAIL: a late DocumentServer disabled the installed eurooffice connector" >&2; exit 1; }
          [ "$(occ config:app:get eurooffice DocumentServerUrl)" = "$marker" ] \
            || { echo "FAIL: an unavailable DocumentServer was reported as configured" >&2; exit 1; }
          docker start aps-conecta-eurooffice >/dev/null
          wait_healthy aps-conecta-eurooffice
          docker restart aps-conecta-nextcloud >/dev/null
          wait_healthy aps-conecta-nextcloud
