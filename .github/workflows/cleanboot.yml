# The full bring-up: install a clinic from nothing and prove it converges. Since the docker-exec
# port, "from nothing" means the disposable AIO probe bed (scripts/aio-testbed.sh, slice 1):
# upstream images, the wizard on :8080, apache loopback-only — the SAME kind of instance an
# operator gets, with no S1 dependency, which is what keeps this job green continuously through
# the port. Wall time is now ~15 min with the image pulls (the compose-era ~3).
#
# It lives in its own file because GitHub filters paths per WORKFLOW, not per job — the only way to
# run this on the PRs that can break it while the static gate still runs on all of them.
#
# WHY IT RUNS ON PULL REQUESTS (#97). Schedule/dispatch only, it never ran on its own; the first
# dispatch, on 2026-08-01, failed on #96 — a bug already merged to main that this gate would have
# caught on its PR. It cannot be a REQUIRED check (branch protection needs GitHub Pro or a public
# repo), so the red X is advisory — exactly why the trigger matters: visibility is the mechanism.
name: Clean boot

on:
  # Everything a clean install reads. Docs, themes and apps/ are deliberately absent — they cannot
  # change what `make install` builds. sites/** drives the groups, folders and ACL matrix, and
  # .env.example is copied verbatim by the first step below and has broken that step before.
  # dev/** is here because 12-apps SOURCES dev/lab-apps.sh (ADR-0005): the file is inert on a clinic,
  # but a syntax error in it still kills the phase, so it is part of the install path now.
  pull_request:
    paths:
      # Everything a clean install reads, in THIS repository now: the host bundle, the scripts
      # tree, the executor phases, the bootstrap's own three files. gestion's half (sites/**,
      # the vendored apps, the themes) is read at its main ref — the schedule and dispatch
      # arms stay its drift backstop, exactly as they already were for runner-image drift.
      - 'host/**'
      - 'scripts/**'
      - 'provisioning/**'
      - 'install.sh'
      - 'VERSION'
      - 'installer.pub'
      - '.github/workflows/cleanboot.yml'
  # Kept as the backstop for drift no PR causes. Our own bytes stopped being a source of it — images
  # pinned by digest (#109), apps vendored as committed tarballs (#98) — so what still moves untouched
  # is the runner image and the actions. `image-digests` reports the other half an hour earlier.
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:

# The event is part of the group, so a push can only ever cancel another push. Without it, the
# weekly clean boot and ordinary pushes to main shared one group: merge a PR while Monday's
# bring-up is running and it is cancelled — and a cancelled run is not a failure, so there is no
# notification and no red check. The one job that proves the stack comes up from empty would simply
# have stopped happening, quietly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# The full bring-up: install a clinic from nothing and prove it converges. Since the docker-exec
# port, "from nothing" means the disposable AIO probe bed (scripts/aio-testbed.sh, slice 1):
# upstream images, the wizard on :8080, apache loopback-only — the SAME kind of instance an
# operator gets, with no S1 dependency, which is what keeps this job green continuously through
# the port. The bring-up itself runs ~15 min with the image pulls (the compose-era ~3); the
# gate stack below adds the reboot + re-seed arms on top (each bounded, minutes).
#
# THE GATE STACK (S8, slice 20): the job does not stop at "the install completed" — it ends with
# the handoff contract: the divergence gate green on the clean install (the FRD S8 acceptance:
# divergence-empty INCLUDING user coverage), the store-off reboot chain RUN (slice 13 verified it
# against the shipped sources; this job is the only place it ever executes), the seed converging
# again after that reboot (idempotency across a restart, the hardened seed-twice), and make test
# with the office gate answering the probe (the AIO legs landed with this slice).
#
# It lives in its own file because GitHub filters paths per WORKFLOW, not per job — the only way
# to run this on the PRs that can break it while the static gate still runs on all of them.
#
# WHY IT RUNS ON PULL REQUESTS (#97). Schedule/dispatch only, it never ran on its own; the first
# dispatch, on 2026-08-01, failed on #96 — a bug already merged to main that this gate would have
# caught on its PR. It cannot be a REQUIRED check (branch protection needs GitHub Pro or a public
# repo), so the red X is advisory — exactly why the trigger matters: visibility is the mechanism.

# on:, schedule:, workflow_dispatch: and concurrency: are UNCHANGED (on disk).

jobs:
  cleanboot:
    name: Clean boot
    # THE RUNNER DECISION (S8, this slice — the commitment the artifact's Decisions and
    # Performance rows deferred here "with evidence from the probe"): GitHub-hosted ubuntu-latest
    # ADOPTED. The margins, from the probe's own measured numbers: the harness's RAM floor is
    # ≥3.5 GiB available for the container set (its check_ram) against the runner's 16 GB; the
    # image pull budget ~6 GB (start_post's bound) against ~14 GB of SSD. Both hold with
    # multiples to spare, so no self-hosted runner is warranted. The recorded lever if a future
    # runner shape goes tight (disk or minutes): the harness's minimal-sibling toggles — the
    # upgrade path, not needed at adoption.
    runs-on: ubuntu-latest
    # 60, not the port-era 45: the gate stack adds the reboot arm (a 10-min-bounded re-settle)
    # plus a second seed-idempotent and two divergence reads on top of the bring-up's own
    # bounds. Every arm still fails loudly INSIDE its own bound — this number is only the CI
    # backstop above those, and 45 would cut a legitimately slow reboot mid-walk.
    timeout-minutes: 60
    env:
      # One identity, derived everywhere below. The harness installs this throwaway domain
      # (SKIP_DOMAIN_VALIDATION + RFC-2606 .invalid: no DNS, no Let's Encrypt), and the
      # OFFICE_PUBLIC_URL append must equal the value the AIO entrypoint itself writes
      # (https://$NC_DOMAIN/eurooffice) so phase 14's query-before-set converges on it instead of
      # clobbering it — and so smoke's check 14 reads a non-loopback editor URL, which the
      # compose default (localhost:$OFFICE_PORT) would redden the moment the domain landed in
      # trusted_domains. Under AIO the entrypoint rewrites the connector's public
      # DocumentServerUrl and jwt_secret on every boot and leaves the internal URLs unset (phase
      # 14 writes them for an install by IP only); this probe sets them itself (the «Probe office
      # wire» step), and office-smoke's legs (slice 20) assert against the values the instance
      # carries — --check answers the internal URL, the healthcheck the public path, so the probe
      # exercises the office wire without any DNS for the domain.
      AIO_TEST_DOMAIN: aio-ci.invalid
      # The probe's apache binds 127.0.0.1:${AIO_TEST_APACHE_PORT} and runs auto_https OFF
      # (APACHE_PORT != 443): plain HTTP — which is what lets smoke's curls answer
      # http://localhost:${HTTP_PORT} with zero HTTP-surface changes. The port is
      # docker-transport-only by design.
      AIO_TEST_APACHE_PORT: "11000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # VERSION answers suite_tag() now — no tag history to read
      # The composite's gestion half (D2): the suite-definition content the package folds in —
      # checked out beside, exactly what the bake and package-release read. APS_BOT_PAT
      # because gestion is private: the job's own token cannot read a sibling repository.
      # .git/info/exclude (below) keeps it out of the throwaway commit — a local ignore,
      # never a tracked one; the archive that becomes the package must not swallow it.
      - uses: actions/checkout@v4
        with:
          repository: APS-Conecta/gestion
          path: gestion
          token: ${{ secrets.APS_BOT_PAT }}
          fetch-depth: 1
      # The probe bed FIRST, so a harness preflight failure (RAM, ports, ghcr reachability) is
      # the first thing a red log shows. Every wait inside is bounded, and `up` ends in its own
      # port gate — the runner never claims 80/443, and :8080 is the only publish.
      - name: Bring up the disposable AIO instance
        run: bash scripts/aio-testbed.sh up
      # FIRST BOOT, the one sibling whose absence kills a first boot: the notify-push
      # container's own start dies when the app binary is absent (Containers/notify-push/
      # start.sh:31-41) — the FRD S3 first-boot acceptance, whose CI owner this step is (the
      # interim images boot-smoke checks the wizard only). On this stock probe the entrypoint
      # installed the app from the store at first boot (the store is still on until the
      # harness's probe state lands); on a suite clinic the bake ships the binary and the store
      # never answers — both postures converge to the same observable: the sibling runs. The
      # store-off reboot below re-asserts it.
      - name: First boot — the notify-push sibling converged
        run: |
          docker ps --filter name=aps-conecta-notify-push --filter status=running --format '{{.Names}}' \
            | grep -qx aps-conecta-notify-push \
            || { echo "FAIL: aps-conecta-notify-push is not running after first boot (the S3 first-boot acceptance) — diagnose: docker ps -a --filter name=aps-conecta-notify-push ; docker logs aps-conecta-notify-push" >&2; exit 1; }
      - name: Build the rehearsal package, then install through the real bootstrap
        run: |
          set -euo pipefail
          # signify BEFORE anything: the runner plays a host that already carries the verifier,
          # so the bootstrap's opportunistic check runs the REAL crypto (D5's second layer), and
          # package-release's own self-test needs it too
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd
          sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify   # the apt package ships the binary under its full name
          tag="ci-cleanboot-${GITHUB_SHA:0:12}"
          echo "gestion/" >> .git/info/exclude
          # the throwaway key replaces the placeholder exactly the way aps/RELEASING.md's real
          # keygen will (one commit: installer.pub + install.sh's constant), and the throwaway
          # tag carries VERSION — the release job's own assert, proven on every PR
          ensayo="$RUNNER_TEMP/ensayo"; mkdir -p "$ensayo/srv/releases/download/$tag" "$ensayo/dist"
          ( umask 077 && signify -G -n -p "$ensayo/installer.pub" -s "$ensayo/installer.sec" -c "cleanboot rehearsal key" )
          sed -i "s|^SIGNIFY_PUBKEY=\"[^\"]*\"|SIGNIFY_PUBKEY=\"$(sed -n 2p "$ensayo/installer.pub")\"|" install.sh
          cp "$ensayo/installer.pub" installer.pub
          printf '%s\n' "$tag" > VERSION
          git config user.email cleanboot@invalid && git config user.name cleanboot
          git add -A && git commit -qm "rehearsal: the package at $tag" && git tag "$tag"
          RELEASE_TAG="$tag" GESTION_TREE="$PWD/gestion" \
            MINISIGN_SECRET_KEY="$(cat "$ensayo/installer.sec")" MINISIGN_KEY_PASSWORD="" \
            bash scripts/package-release.sh --out "$ensayo/dist"
          cp "$ensayo/dist/apsconecta-$tag.tar.gz" "$ensayo/dist/SHA256SUMS" \
             "$ensayo/dist/SHA256SUMS.minisig" "$ensayo/dist/apsconecta-$tag-install.sh" \
             "$ensayo/srv/releases/download/$tag/"
          # the one-liner's own shape, against a file:// release layout: verify (sha, SUMS
          # parity, the signature) → unpack atomically → keep the package at paquete/
          curl -fsSL "file://$ensayo/srv/releases/download/$tag/apsconecta-$tag-install.sh" \
            | sudo env REPO_URL="file://$ensayo/srv" bash 2>&1 | tee "$RUNNER_TEMP/bootstrap.out"
          grep -q "firma verificada (signify, clave pública del proyecto)" "$RUNNER_TEMP/bootstrap.out"
          grep -qF "Suite $tag en /opt/aps-conecta/instalador (paquete verificado en /opt/aps-conecta/paquete)" "$RUNNER_TEMP/bootstrap.out"
          # the gates below source env.sh from the package root: the runner writes there
          sudo chown -R "$(id -u):$(id -g)" /opt/aps-conecta/instalador
      - name: The rehearsal's .env, in the package the install will run from
        run: |
          pkg=/opt/aps-conecta/instalador
          # the template beside the .env it spawns: env.sh's require_real_secrets checks for
          # .env.example in the cwd its own cd pins — the seed the package runs needs it there,
          # and a clinic's package never carries it (probe scaffolding, like the .env itself)
          cp gestion/.env.example "$pkg/.env.example"
          hex() { od -An -tx1 -N32 /dev/urandom | LC_ALL=C tr -d ' \n'; }
          # the four secrets env-init itself generates (hex, its own rule) — seed.sh's
          # require_real_secrets refuses any change-me left standing
          sed -e "s/^NEXTCLOUD_ADMIN_PASSWORD=.*/NEXTCLOUD_ADMIN_PASSWORD=$(hex)/" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(hex)/" \
              -e "s/^OFFICE_JWT_SECRET=.*/OFFICE_JWT_SECRET=$(hex)/" \
              -e "s/^FIXTURE_USER_PASSWORD=.*/FIXTURE_USER_PASSWORD=$(hex)/" \
              gestion/.env.example > "$pkg/.env"
          chmod 600 "$pkg/.env"
          {
            echo "HTTP_PORT=${AIO_TEST_APACHE_PORT}"
            echo "OFFICE_PUBLIC_URL=https://${AIO_TEST_DOMAIN}/eurooffice"
          } >> "$pkg/.env"
      # No establishment ships: the site and the planilla a clinic brings, generated at run time
      # (scripts/cleanboot-site.sh — one copy for both jobs) for the probe's domain.
      - name: The site and the planilla a clinic brings
        run: bash /opt/aps-conecta/instalador/scripts/cleanboot-site.sh "$AIO_TEST_DOMAIN" "$RUNNER_TEMP"
      # D8's default floors, measured on real hardware before the probe's own override lowers
      # them: RAM reads green naming both tiers; the disk is the honest variable — the assert
      # holds either way, and the red (when it reds) must name minimum AND recommended tier.
      # rc is the house-guarded capture: run: is `bash -e` without it, and revisar reds here
      # by design (the runner's ~14 GB free sits under the derived 20 GB minimum)
      - name: The default floors read live, before the probe lowers them
        run: |
          set -o pipefail
          rc=0; out="$(sudo bash /opt/aps-conecta/instalador/host/aps-conecta revisar 2>&1)" || rc=$?
          printf '%s\n' "$out"
          grep -q "Memoria .* GiB (mínimo 6" <<<"$out" \
            || { echo "FAIL: the RAM line does not name the floors" >&2; exit 1; }
          if [ "$rc" -eq 0 ]; then
            grep -q "Disco .* GB libres (mínimo 20, recomendado 40)" <<<"$out" \
              || { echo "FAIL: a green disk line must name both tiers" >&2; exit 1; }
          else
            grep -qF "el mínimo es 20 GB" <<<"$out" && grep -qF "se recomiendan 40" <<<"$out" \
              || { echo "FAIL: the disk red must name the minimum and the recommended tier" >&2; exit 1; }
          fi
      # THE SILENT INSTALL (a6, a7): the command a clinic runs, as root, with no terminal — all nine
      # steps, the seed with its gate included. The probe's suite is already up (the testbed above),
      # so «suite» finds it running and drives nothing; AIO_STATE is the testbed's wizard state.
      # Probe knobs only: the 1,1 GB basemap stays out (its /tiles/ route is proven below against a
      # deterministic fixture), and the disk floor fits the runner. Root's writes in the checkout go
      # back to the runner for the gates below.
      - name: Install through the silent command a clinic runs
        run: |
          set -o pipefail   # run: is `bash -e` without it — the install's own failure, not tee's
          sudo env "PATH=$PATH" APS_SKIP_MAP=1 APS_SKIP_DATOS=1 MIN_DISK_GB=2 AIO_STATE=/tmp/aio-testbed \
            bash /opt/aps-conecta/instalador/host/aps-conecta install \
              --sitio "$RUNNER_TEMP/site.sh" --planilla "$RUNNER_TEMP/usuarios.csv" \
            < /dev/null | tee "$RUNNER_TEMP/install.out"
      # a9 on real systemd: the silent install installed both units and enabled the weekly timer,
      # on Santiago time; the monthly one stays off — the map was skipped (APS_SKIP_MAP)
      - name: The timers are installed, in Santiago time
        run: |
          systemctl is-enabled aps-conecta.timer
          systemctl is-active aps-conecta.timer
          systemctl show aps-conecta.timer -p TimersCalendar | grep -qF 'Sun *-*-* 03:00:00 America/Santiago'
          systemctl show aps-conecta-tiles.timer -p TimersCalendar | grep -qF '*-*-04 05:00:00 America/Santiago'
          if systemctl is-enabled aps-conecta-tiles.timer >/dev/null 2>&1; then
            echo "FAIL: the monthly basemap timer is enabled with no map built" >&2; exit 1
          fi
      # Q18 (org review L5-S3): the 404 posture is a contract, not an accident. Before the
      # fixture lands, the operator's own smoke must be GREEN on the unbuilt-map posture —
      # bind present, monthly timer off, 404 said as a NOTE — and must SAY so: the NOTE is the
      # honest state, and a silent green cannot tell "map not built yet" from "route broken".
      # This step proves both halves on a real install; the fixture step below then flips the
      # posture to 206, and make test's smoke later asserts that one instead.
      - name: Smoke green on the 404 posture, the NOTE naming the unbuilt map
        run: |
          out="$RUNNER_TEMP/smoke-404.out"
          bash /opt/aps-conecta/instalador/scripts/smoke.sh > "$out" 2>&1 || { cat "$out" >&2; echo "FAIL: smoke must be green with the map unbuilt (bind present, timer off)" >&2; exit 1; }
          grep -q 'NOTE: /tiles/chile.pmtiles is 404' "$out" \
            || { cat "$out" >&2; echo "FAIL: the unbuilt-map posture must print its NOTE — silent green cannot tell unbuilt from unbound" >&2; exit 1; }
          cat "$out"
      # L5: prove the suite's own /tiles/ route on the real apache — a deterministic fixture (the
      # PMTiles magic + compressible lines, exactly 150000 bytes) stands in for the 1,1 GB archive
      # the runner never builds. Dropped AFTER the install and the timer assert: the install saw
      # no map (APS_SKIP_MAP, the monthly timer stays off), and a later file changes that nothing.
      # 0644 and a 0755 directory: apache (uid 33) reads both through the read-only bind; the ranged
      # read must answer 206 with the exact bytes and no Content-Encoding (encode leaves the
      # archive's octet-stream alone — a recompressed range would break the format).
      - name: The suite serves the basemap same-origin at /tiles/
        run: |
          sudo install -d -m 0755 /srv/aps-conecta/tiles
          python3 - <<'PY'
          data = b"PMTiles\x03" + b"".join(
              b"fixture line %06d: same-origin /tiles/ proof\n" % i for i in range(4100))
          open("/tmp/chile.pmtiles", "wb").write(data[:150000].ljust(150000, b"x"))
          PY
          sudo install -m 0644 /tmp/chile.pmtiles /srv/aps-conecta/tiles/chile.pmtiles
          hdr="$(mktemp)"
          code="$(curl -sS -D "$hdr" -r 0-1023 -H 'Accept-Encoding: gzip, zstd' -o "$RUNNER_TEMP/tiles.rng" \
            -w '%{http_code}' "http://localhost:${AIO_TEST_APACHE_PORT}/tiles/chile.pmtiles")"
          [ "$code" = "206" ] || { echo "FAIL: /tiles/ answered $code, not 206" >&2; cat "$hdr" >&2; exit 1; }
          grep -qi '^content-range: bytes 0-1023/150000' "$hdr" || { cat "$hdr" >&2; exit 1; }
          ! grep -qi '^content-encoding:' "$hdr" || { echo "FAIL: the range came compressed" >&2; cat "$hdr" >&2; exit 1; }
          head -c 1024 /srv/aps-conecta/tiles/chile.pmtiles > "$RUNNER_TEMP/tiles.esp"
          cmp "$RUNNER_TEMP/tiles.rng" "$RUNNER_TEMP/tiles.esp"
      # R26's thresholds: the suite's measured memory on the real run, a table and its total in the
      # summary — one snapshot of the suite's own containers; a diagnostic, so it never reddens the run
      - name: The measured usage — the table and the machine-readable record (R26, D8)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          docker ps --filter name=^aps-conecta- --filter name=^nextcloud-aio-mastercontainer$ --format '{{.Names}}' \
            | xargs -r docker stats --no-stream --format '{{.Name}}|{{.MemUsage}}' | sort > "$RUNNER_TEMP/memoria.txt"
          { echo '| contenedor | memoria |'; echo '| --- | --- |'
            awk -F'|' '{ split($2, m, " / "); v = m[1]; u = v; gsub(/[0-9.]/, "", u); sub(/[A-Za-z]+$/, "", v)
                         s += v * (u == "GiB" ? 1024 : u == "MiB" ? 1 : u == "KiB" ? 1 / 1024 : 1 / 1048576)
                         print "| " $1 " | " m[1] " |" }
                       END { printf "| **total** | %.0f MiB |\n", s }' "$RUNNER_TEMP/memoria.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - "$RUNNER_TEMP/uso.json" <<'PY'
          import json, subprocess, sys
          def run(*cmd):
              return subprocess.run(cmd, capture_output=True, text=True).stdout
          names = [n for n in run("docker", "ps", "--filter", "name=^aps-conecta-",
                                  "--filter", "name=^nextcloud-aio-mastercontainer$",
                                  "--format", "{{.Names}}").splitlines() if n]
          stats = [json.loads(ln) for ln in
                   run("docker", "stats", "--no-stream", "--format", "{{json .}}", *names).splitlines()
                   if ln.strip()] if names else []
          lineas = run("df", "-B1", "--output=source,fstype,size,used,avail,pcent,target",
                       "/", "/var/lib/docker").splitlines()
          cabe, disco, vistos = lineas[0].split(), [], set()
          for ln in lineas[1:]:
              fila = dict(zip(cabe, ln.split(None, len(cabe) - 1)))
              if fila["source"] not in vistos:
                  vistos.add(fila["source"]); disco.append(fila)
          try:
              total = int(next(l.split()[1] for l in open("/proc/meminfo", encoding="utf-8")
                               if l.startswith("MemTotal:")))
          except (OSError, StopIteration, ValueError):
              total = 0
          json.dump({"memoria_gib": round(total / 1048576, 1), "contenedores": stats, "disco": disco},
                    open(sys.argv[1], "w", encoding="utf-8"), indent=1)
          PY
      - name: The usage record, as an artifact (a missing record is a red, never a silent skip)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uso-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uso.json
          if-no-files-found: error
      - name: Hand the checkout back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      # a7's console contract on the real run — a5's two checks over what the operator saw: the
      # verdict, no internals, no English (every tool's own output went to the install's log)
      - name: The silent install printed only Spanish lines
        run: |
          out="$RUNNER_TEMP/install.out"
          grep -q '^INSTALACIÓN: ✓' "$out"
          ! grep -nE '^[[:space:]]*#|set -uo|readlink|HOST_DIR|\$\{|\bslice\b|\bFRD\b|\bB-[0-9]{3}\b|\bR[0-9]{1,2}\b|\bD[0-9]{1,2}\b|#[0-9]{2,}' "$out"
          ! grep -niwE 'the|failed|not found|warning|missing|usage|error|pulling|phase' "$out"
      # a8, on the instance the silent install left: every planilla user is in all-staff and the
      # category of their role, and every cargo account has its own sealed first password
      - name: The planilla landed by role, and each cargo has its own password
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ group:list --output=json > "$RUNNER_TEMP/groups.json"
          python3 - "$RUNNER_TEMP/groups.json" <<'PY'
          import json, sys
          groups = json.load(open(sys.argv[1], encoding="utf-8"))
          for uid, cat in (("ana.prueba", "cat-clinicos"), ("beto.prueba", "cat-tecnicos")):
              assert uid in groups["all-staff"] and uid in groups[cat], f"{uid} not in all-staff + {cat}"
          PY
          sudo python3 - <<'PY'
          import csv
          with open("/opt/aps-conecta/credentials.txt", encoding="utf-8") as fh:
              rows = [r for r in csv.reader(fh, delimiter=";") if r and not r[0].startswith("#") and r[0] != "usuario"]
          cargos = [r for r in rows if r[1].startswith("Cargo ")]
          assert len(cargos) >= 5, f"{len(cargos)} cargo rows"
          assert len({r[2] for r in rows}) == len(rows), "two accounts share a password"
          print(f"credentials: {len(rows)} rows, {len(cargos)} cargos, every password distinct")
          PY
      # Paired with the SITE_ROLES appended above (#103), because "the seed did not crash" is
      # not the same as "the roles landed". Asserts both halves of the rule: a cat-jefaturas
      # role is a POSITION and gets a standing account; a cat-tecnicos one is a job title held
      # by people who arrive with the roster (#106), so it must NOT. The negative is the half
      # that would rot silently — an over-eager loop creating accounts for every local role
      # looks like success. One occ() definition, sourced (slice 2) — and the seam's default
      # IS this job's container: the harness brought up aps-conecta-nextcloud, so the
      # NC_CONTAINER stopgap died here with the compose bring-up it existed to bridge.
      - name: Clinic-local roles landed, and only the jefatura got an account
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ group:list | grep -q role-jefe-sar
          occ group:list | grep -q role-tens-sar
          occ user:info jefe.sar > /dev/null
          if occ user:info tens.sar > /dev/null 2>&1; then
            echo "FAIL: tens.sar exists — a cat-tecnicos role must not create a standing account" >&2
            exit 1
          fi
      # (P35, implement-time — measured on the probe) the entrypoint writes only the PUBLIC
      # DocumentServerUrl; a real clinic's public DNS answers every server-side office leg. The
      # probe's .invalid domain has no DNS and its apache listens on $AIO_TEST_APACHE_PORT
      # internally, so the office wire's server-to-server legs get the internal names — the
      # same probe-adaptation posture HTTP_PORT/OFFICE_PUBLIC_URL already carry.
      - name: Probe office wire — the internal URLs the loopback-only probe needs
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ config:app:set eurooffice DocumentServerInternalUrl --value http://aps-conecta-eurooffice/
          occ config:app:set eurooffice StorageUrl --value "http://aps-conecta-apache:${AIO_TEST_APACHE_PORT}/"
          occ config:system:set trusted_domains 2 --value=aps-conecta-apache
      # The only place a first AND a second seed both exist. Idempotency is the pipeline's
      # defining property (AD-2) and nothing else asserts it: a warm dev box cannot tell
      # "already correct" from "silently did nothing", because on a warm box those are the
      # same thing.
      - run: bash /opt/aps-conecta/instalador/scripts/seed-idempotent.sh
      # THE HANDOFF CONTRACT (S8's acceptance): divergence-empty on a clean install, users
      # included — the gate-only domain (slice 5). The gate reads the declared set (the SITE_
      # ROSTER roster the silent install loaded — the standings re-derived from the site it placed
      # at sites/<DEIS>/site.sh, and the
      # install's own admin) and the live set in-container, and exits 1 on ANY note: drift,
      # parser rot, transport rot. A green here is the FRD's S8 line, in CI, on a real install.
      - name: Divergence gate — the clean install's handoff contract
        run: bash /opt/aps-conecta/instalador/scripts/divergence.sh --gate
      # THE UPDATE-DAY POSTURE, run for real (slice 13 verified the store-off reboot chain
      # against the shipped v34.0.4 sources — AppStoreFetcher::get returns [] with
      # appstoreenabled=0, so the entrypoint's app:update legs answer "up-to-date" and exit 0;
      # the unbounded store-reachability wait fires only on image-bump boots — but no probe
      # ever REBOOTED with the store off: the gap this arm closes). A same-image restart re-runs
      # the whole entrypoint under the probe's store-off posture; the bound is the harness's
      # own install-wait shape.
      - name: Reboot the instance with the store off — the update-day posture
        run: |
          docker restart aps-conecta-nextcloud
          boot_t0=$(date +%s)
          for i in $(seq 60); do
            st="$(docker exec --user www-data aps-conecta-nextcloud php /var/www/html/occ status --output=json 2>/dev/null || true)"
            case "$st" in *'"installed":true'*) echo "occ status ready (attempt $i)"; break ;; esac
            sleep 10
          done
          # (P34, implement-time — measured on the probe) occ-status-ready is NOT entrypoint-done:
          # the app walk (support/spreed re-enabled globally) lands ~2 min later. Wait for fpm's
          # ready line before any seed touches the state the walk rewrites.
          for i in $(seq 60); do
            if docker logs --since "$(( $(date +%s) - boot_t0 - 5 ))s" aps-conecta-nextcloud 2>&1 | grep -q "ready to handle connections"; then
              echo "entrypoint settled (attempt $i)"; exit 0
            fi
            sleep 10
          done
          echo "FAIL: the instance never settled within 10 min of the store-off reboot — docker logs aps-conecta-nextcloud" >&2
          exit 1
      # THE HARDENED SEED-TWICE: the third seed runs against a REBOOTED instance, not a warm
      # one — idempotency across a restart, the strongest form this job can run — and the
      # divergence gate answers again post-reboot (the entrypoint's re-run changed nothing the
      # declared set does not name). The notify-push sibling re-assert: it survived the reboot
      # of the container it pushes FOR.
      - name: The post-reboot seed still converges, and the gates stay green
        run: |
          # (P34, implement-time) the entrypoint's boot re-enables its own apps (support, spreed)
          # globally — the update-day doctrine is converge-then-prove: the convergence seed
          # re-asserts the declared set over whatever the entrypoint reset, and the idempotence
          # proof then holds on the converged state (measured green on the probe).
          bash /opt/aps-conecta/instalador/provisioning/seed.sh
          bash /opt/aps-conecta/instalador/scripts/seed-idempotent.sh
          bash /opt/aps-conecta/instalador/scripts/divergence.sh --gate
          docker ps --filter name=aps-conecta-notify-push --filter status=running --format '{{.Names}}' \
            | grep -qx aps-conecta-notify-push \
            || { echo "FAIL: aps-conecta-notify-push is not running after the store-off reboot" >&2; exit 1; }
      # The full local gate — smoke's 14 checks through the probe's loopback apache, the
      # office gate answering the AIO sibling since this slice (office-smoke's AIO legs:
      # public-path healthcheck + --check + the DS 9.3.x pin + the image namespaces), and the
      # two hermetic self-tests riding test.sh's static section.
      # Smoke's check 15 (developer-only, B-031) logs in as the admin .env names; on AIO that
      # admin's password is AIO's own, so this throwaway testbed's admin takes .env's first.
      # A clinic's admin login is never touched: install's health line skips check 15. The
      # password rides docker exec -e, never argv.
      - name: The testbed's admin takes .env's password — the smoke probe logs in with it
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          OC_PASS="$NEXTCLOUD_ADMIN_PASSWORD" nc_exec -e OC_PASS --user www-data -- \
            php /var/www/html/occ user:resetpassword --password-from-env "$NEXTCLOUD_ADMIN_USER"
      # the stack gates, from the package a clinic runs (the static half is instalador's own
      # job — scripts/test.sh, ci.yml)
      - name: The stack gates, from the package a clinic runs
        run: |
          cd /opt/aps-conecta/instalador
          bash scripts/smoke.sh
          bash scripts/office-smoke.sh
      # a10 on the real weekly path, last (it re-runs the seed as the timer would): a hand-added group
      # is drift — the unit fails, «aps-conecta estado» names the item and its fix without sudo, and the
      # admin's notifications carry it; the group is removed afterwards
      - name: A weekly drift reaches «aps-conecta estado» and the admin
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ group:add deriva-prueba >/dev/null
          if sudo systemctl start aps-conecta.service; then
            echo "FAIL: the weekly unit passed on a drifted instance" >&2; exit 1
          fi
          sudo journalctl -u aps-conecta.service --no-pager -n 40
          if aps-conecta estado > "$RUNNER_TEMP/estado.out"; then
            echo "FAIL: estado exited 0 on a drifted instance" >&2; exit 1
          fi
          cat "$RUNNER_TEMP/estado.out"
          grep -q '✗ deriva' "$RUNNER_TEMP/estado.out"
          grep -q "el grupo 'deriva-prueba' existe pero no está declarado" "$RUNNER_TEMP/estado.out"
          grep -q "occ group:delete deriva-prueba" "$RUNNER_TEMP/estado.out"
          curl -fsS -u "${NEXTCLOUD_ADMIN_USER:-admin}:${NEXTCLOUD_ADMIN_PASSWORD}" -H 'OCS-APIRequest: true' \
            "http://localhost:${HTTP_PORT}/ocs/v2.php/apps/notifications/api/v2/notifications?format=json" \
            | grep -q 'deriva-prueba' || { echo "FAIL: the admin has no notification naming the drift" >&2; exit 1; }
          occ group:delete deriva-prueba >/dev/null
          # the unit ran as root against this checkout: hand it back, as after the install
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      # No compose context exists on this runner anymore: the probe's logs come from docker
      # itself, and the container listing is what shows a sibling that never converged.
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=^aps-conecta- --filter name=^nextcloud-aio-mastercontainer$ --format 'table {{.Names}}\t{{.Status}}'
          docker logs --tail=100 aps-conecta-nextcloud
          sudo tail -n 100 /opt/aps-conecta/instalacion.log || true
      # `make install` prints phase names and sends the detail to .install.log, so without this
      # the one job that exists to catch a broken install cannot show what broke — #96 was
      # diagnosed only after adding it. include-hidden-files because .install.log is a dotfile
      # and upload-artifact@v4 skips those by default, which silently uploaded nothing on the
      # first attempt.
      - name: Provisioning log on failure
        if: failure()
        run: sudo cp /opt/aps-conecta/instalador/.install.log "$RUNNER_TEMP/.install.log" 2>/dev/null || true
      - name: Provisioning log on failure (artifact)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-log
          path: ${{ runner.temp }}/.install.log
          include-hidden-files: true
          if-no-files-found: warn
      # Scoped teardown, always — the harness removes only the suite's containers and its nextcloud_aio_* volumes
      # (name/label-filtered) plus its own state dir, so `down` after a failed `up` is safe by
      # construction. On an ephemeral runner this is hygiene; it also keeps the job honest
      # about never leaving the wizard port published.
      - name: Probe teardown
        if: always()
        run: bash scripts/aio-testbed.sh down

  cleanboot-ip:
    name: Clean boot by IP
    # a19's automatable arm: a clinic without a domain, installed the way any machine installs it — the
    # silent command alone, no testbed. The install starts the suite itself, by this runner's own
    # address (detected, never written down), served on 443 with the installer's own certificate. The
    # disposable runner owns 443 and 8080; nothing else runs on it. Talk stays off (the silent
    # install's default), so the pulls are the domain job's.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # VERSION answers suite_tag() now — no tag history to read
      # The composite's gestion half (D2) — same dual checkout as the domain job (Modify 2).
      - uses: actions/checkout@v4
        with:
          repository: APS-Conecta/gestion
          path: gestion
          token: ${{ secrets.APS_BOT_PAT }}
          fetch-depth: 1
      - name: Build the rehearsal package, then install through the real bootstrap
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y signify-openbsd
          sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify   # the apt package ships the binary under its full name
          tag="ci-cleanboot-${GITHUB_SHA:0:12}"
          echo "gestion/" >> .git/info/exclude
          ensayo="$RUNNER_TEMP/ensayo"; mkdir -p "$ensayo/srv/releases/download/$tag" "$ensayo/dist"
          ( umask 077 && signify -G -n -p "$ensayo/installer.pub" -s "$ensayo/installer.sec" -c "cleanboot rehearsal key" )
          sed -i "s|^SIGNIFY_PUBKEY=\"[^\"]*\"|SIGNIFY_PUBKEY=\"$(sed -n 2p "$ensayo/installer.pub")\"|" install.sh
          cp "$ensayo/installer.pub" installer.pub
          printf '%s\n' "$tag" > VERSION
          git config user.email cleanboot@invalid && git config user.name cleanboot
          git add -A && git commit -qm "rehearsal: the package at $tag" && git tag "$tag"
          RELEASE_TAG="$tag" GESTION_TREE="$PWD/gestion" \
            MINISIGN_SECRET_KEY="$(cat "$ensayo/installer.sec")" MINISIGN_KEY_PASSWORD="" \
            bash scripts/package-release.sh --out "$ensayo/dist"
          cp "$ensayo/dist/apsconecta-$tag.tar.gz" "$ensayo/dist/SHA256SUMS" \
             "$ensayo/dist/SHA256SUMS.minisig" "$ensayo/dist/apsconecta-$tag-install.sh" \
             "$ensayo/srv/releases/download/$tag/"
          curl -fsSL "file://$ensayo/srv/releases/download/$tag/apsconecta-$tag-install.sh" \
            | sudo env REPO_URL="file://$ensayo/srv" bash 2>&1 | tee "$RUNNER_TEMP/bootstrap.out"
          grep -q "firma verificada (signify, clave pública del proyecto)" "$RUNNER_TEMP/bootstrap.out"
          grep -qF "Suite $tag en /opt/aps-conecta/instalador (paquete verificado en /opt/aps-conecta/paquete)" "$RUNNER_TEMP/bootstrap.out"
          sudo chown -R "$(id -u):$(id -g)" /opt/aps-conecta/instalador
          # the rehearsal's .env, in the package (the domain job's own step, same shape)
          pkg=/opt/aps-conecta/instalador
          cp gestion/.env.example "$pkg/.env.example"
          hex() { od -An -tx1 -N32 /dev/urandom | LC_ALL=C tr -d ' \n'; }
          sed -e "s/^NEXTCLOUD_ADMIN_PASSWORD=.*/NEXTCLOUD_ADMIN_PASSWORD=$(hex)/" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(hex)/" \
              -e "s/^OFFICE_JWT_SECRET=.*/OFFICE_JWT_SECRET=$(hex)/" \
              -e "s/^FIXTURE_USER_PASSWORD=.*/FIXTURE_USER_PASSWORD=$(hex)/" \
              gestion/.env.example > "$pkg/.env"
          chmod 600 "$pkg/.env"
      # The address the kernel routes by — the installer's own link probes the same.
      - name: The site and the planilla a clinic brings, by this runner's address
        run: |
          ip="$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')"
          [ -n "$ip" ] || { echo "FATAL: no routed IPv4 address on this runner" >&2; exit 1; }
          echo "SUITE_IP=$ip" >> "$GITHUB_ENV"
          bash /opt/aps-conecta/instalador/scripts/cleanboot-site.sh "$ip" "$RUNNER_TEMP"
      # The silent install, as root, with no terminal. The suite tag is the testbed's one pin, so both
      # jobs run the same published suite.
      - name: Install by IP through the silent command a clinic runs
        run: |
          set -o pipefail   # run: is `bash -e` without it — the install's own failure, not tee's
          tag="$(sed -n 's/^IMAGE="${AIO_TEST_IMAGE:-ghcr.io\/aps-conecta\/all-in-one:\(ci-[0-9]\{8\}-[0-9]\{1,\}\)}"$/\1/p' scripts/aio-testbed.sh)"
          [[ "$tag" =~ ^ci-[0-9]{8}-[0-9]+$ ]] || { echo "FATAL: no single suite tag pinned in scripts/aio-testbed.sh" >&2; exit 1; }
          # APS_SUITE_TAG: the package's VERSION is the throwaway rehearsal tag, but the
          # mastercontainer this job CREATES must run a published image — the pinned ci tag
          # (suite_tag() answers the override first; the rehearsal-window seam it exists for)
          sudo env "PATH=$PATH" APS_SKIP_MAP=1 APS_SKIP_DATOS=1 MIN_DISK_GB=2 APS_SUITE_TAG="$tag" \
            bash /opt/aps-conecta/instalador/host/aps-conecta install \
              --sitio "$RUNNER_TEMP/site.sh" --planilla "$RUNNER_TEMP/usuarios.csv" \
            < /dev/null | tee "$RUNNER_TEMP/install.out"
      - name: Hand the checkout back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      # a19: https://<ip>/ answers with the installer's certificate — trusted through its CA, refused
      # without it (curl 60: the peer's certificate is not trusted) — the install ends naming the CA,
      # and a planilla user logs in. The CA is copied out as the operator would (its directory is
      # root's, 0700); the password is read from the sealed sheet as root and reaches curl on stdin.
      - name: The suite answers at https://<ip>/, trusted through the installer's CA only; a user logs in
        run: |
          ca=/opt/aps-conecta/certificados/ca/aps-conecta-ca.crt
          sudo install -m 0644 -o "$(id -u)" "$ca" "$RUNNER_TEMP/ca.crt"
          curl -fsS --cacert "$RUNNER_TEMP/ca.crt" "https://$SUITE_IP/status.php" | grep -q '"installed":true'
          rc=0; curl -sS -o /dev/null "https://$SUITE_IP/status.php" || rc=$?
          [ "$rc" = 60 ] || { echo "FAIL: without the CA curl exited $rc, not 60" >&2; exit 1; }
          grep -q '^INSTALACIÓN: ✓' "$RUNNER_TEMP/install.out"
          grep -qF "Certificado para los equipos del personal: $ca (huella SHA-256 " "$RUNNER_TEMP/install.out"
          pw="$(sudo python3 - <<'PY'
          import csv
          with open("/opt/aps-conecta/credentials.txt", encoding="utf-8") as fh:
              print(next(r[2] for r in csv.reader(fh, delimiter=";") if r and r[0] == "ana.prueba"))
          PY
          )"
          printf 'user = "ana.prueba:%s"\n' "$pw" \
            | curl -fsS -K - --cacert "$RUNNER_TEMP/ca.crt" -H 'OCS-APIRequest: true' \
                "https://$SUITE_IP/ocs/v2.php/cloud/user?format=json" | grep -q '"id":"ana.prueba"'
      # Nextcloud's own side of the address: its bundle trusts the CA (phase 07), the push server reaches
      # it inside the suite's network (the fork's patch 238), and the office both ways (phase 14).
      - name: Nextcloud trusts the CA; push and office work by IP
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ security:certificates --output=json \
            | python3 -c 'import json, sys; sys.exit(not any(r.get("name") == "aps-conecta-ca.crt" for r in json.load(sys.stdin)))'
          occ notify_push:self-test
          occ eurooffice:documentserver --check
      # L5 by IP: the same deterministic fixture, then the /tiles/ route over the installer's own
      # certificate — tile_url derived from this runner's own address (phase 16), and the
      # operator's own check (host/tiles.sh check: the archive, the bind, a ranged read through
      # the suite's internal network) green on a real install.
      - name: The basemap is served same-origin at /tiles/, by IP
        run: |
          sudo install -d -m 0755 /srv/aps-conecta/tiles
          python3 - <<'PY'
          data = b"PMTiles\x03" + b"".join(
              b"fixture line %06d: same-origin /tiles/ proof\n" % i for i in range(4100))
          open("/tmp/chile.pmtiles", "wb").write(data[:150000].ljust(150000, b"x"))
          PY
          sudo install -m 0644 /tmp/chile.pmtiles /srv/aps-conecta/tiles/chile.pmtiles
          hdr="$RUNNER_TEMP/tiles.hdr"
          code="$(curl -fsS --cacert "$RUNNER_TEMP/ca.crt" -D "$hdr" -r 0-1023 -H 'Accept-Encoding: gzip, zstd' \
            -o "$RUNNER_TEMP/tiles.rng" -w '%{http_code}' "https://$SUITE_IP/tiles/chile.pmtiles")"
          [ "$code" = "206" ] || { echo "FAIL: /tiles/ answered $code, not 206" >&2; cat "$hdr" >&2; exit 1; }
          grep -qi '^content-range: bytes 0-1023/150000' "$hdr" || { cat "$hdr" >&2; exit 1; }
          ! grep -qi '^content-encoding:' "$hdr" || { echo "FAIL: the range came compressed" >&2; cat "$hdr" >&2; exit 1; }
          head -c 1024 /srv/aps-conecta/tiles/chile.pmtiles > "$RUNNER_TEMP/tiles.esp"
          cmp "$RUNNER_TEMP/tiles.rng" "$RUNNER_TEMP/tiles.esp"
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          [ "$(occ config:app:get territorio tile_url)" = "https://$SUITE_IP/tiles/chile.pmtiles" ] \
            || { echo "FAIL: tile_url is not the runner's own same-origin URL" >&2; occ config:app:get territorio tile_url >&2; exit 1; }
          sudo bash /opt/aps-conecta/instalador/host/tiles.sh check
      # The weekly run, by IP, on the instance just installed: the leaf is kept (same fingerprint) and
      # apache is not restarted; the seed converges again, idempotent by IP too.
      - name: The weekly run keeps the leaf and apache as they are
        run: |
          leaf=/opt/aps-conecta/certificados/suite/tls.crt
          antes="$(sudo sha256sum "$leaf")"; arranque="$(docker inspect -f '{{.State.StartedAt}}' aps-conecta-apache)"
          sudo env "PATH=$PATH" bash /opt/aps-conecta/instalador/host/aps-conecta provision --reponer
          [ "$(sudo sha256sum "$leaf")" = "$antes" ] || { echo "FAIL: the weekly run signed a leaf that was valid" >&2; exit 1; }
          [ "$(docker inspect -f '{{.State.StartedAt}}' aps-conecta-apache)" = "$arranque" ] \
            || { echo "FAIL: the weekly run restarted apache with nothing renewed" >&2; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=^aps-conecta- --filter name=^nextcloud-aio-mastercontainer$ --format 'table {{.Names}}\t{{.Status}}'
          docker logs --tail=100 aps-conecta-apache || true
          docker logs --tail=100 aps-conecta-nextcloud || true
          sudo tail -n 100 /opt/aps-conecta/instalacion.log || true
      # The same scoped teardown as the domain job: the suite's containers, its volumes, the wizard.
      - name: Teardown
        if: always()
        run: bash scripts/aio-testbed.sh down
