          [ -n "$fver" ] || { echo "FAIL: the lock no longer names farmacia" >&2; exit 1; }
          read -r etag ever _esha <<< "$(sudo python3 -c 'import json; a = json.load(open("/opt/aps-conecta/apps.lock.json"))["apps"]["estadistica"]; print(a["tag"], a["version"], a["sha256"])')"
          [ -n "$ever" ] || { echo "FAIL: the lock no longer names estadistica" >&2; exit 1; }
