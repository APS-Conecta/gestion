          docker exec aps-antivirus-boundary killall -KILL c-icap
          docker exec aps-antivirus-boundary killall -CONT clamd
          task_av_transport=0
          wait "$task_av_pid" || task_av_transport=$?
          task_av_pid=
          code="$(cat "$task_av_dir/midstream.code")"
          if [ "$task_av_transport" != 0 ] || ! [[ "$code" =~ ^[45][0-9][0-9]$ ]] \
            || ! grep -q 'contacte a la administración' "$task_av_dir/midstream.xml"; then
            echo "FAIL: an interrupted scan returned HTTP $code without actionable Spanish guidance" >&2
            task_av_failed=1
          fi
          code="$(dav --output /dev/null "$task_av_url/antivirus-midstream-184.bin")"
          [ "$code" = 404 ]
          wait_boundary
          code="$(dav --upload-file "$task_av_dir/clean.txt" --output "$task_av_dir/response.xml" "$task_av_url/antivirus-midstream-184.bin")"
          [ "$code" = 201 ] || [ "$code" = 204 ]
          echo 'PASS: an interrupted scan rejects the upload and recovers for a clean retry'
          docker stop --time 10 aps-antivirus-boundary >/dev/null
          code="$(dav --upload-file "$task_av_dir/clean.txt" --output "$task_av_dir/response.xml" "$task_av_url/antivirus-unavailable-184.txt")"
          [ "$code" = 415 ] && grep -q 'El antivirus no está disponible' "$task_av_dir/response.xml" \
            || { echo "FAIL: an unavailable scanner returned HTTP $code without Spanish recovery guidance" >&2; exit 1; }
          code="$(dav --output /dev/null "$task_av_url/antivirus-unavailable-184.txt")"
          [ "$code" = 404 ]
          [ "$(docker exec --user www-data aps-conecta-nextcloud php occ config:app:get files_antivirus enabled)" = yes ]
          docker start aps-antivirus-boundary >/dev/null
          wait_boundary
          code="$(dav --upload-file "$task_av_dir/clean.txt" --output "$task_av_dir/response.xml" "$task_av_url/antivirus-unavailable-184.txt")"
          [ "$code" = 201 ] || [ "$code" = 204 ]
          code="$(dav --output "$task_av_dir/download.txt" "$task_av_url/antivirus-unavailable-184.txt")"
          [ "$code" = 200 ] && cmp "$task_av_dir/clean.txt" "$task_av_dir/download.txt"
          echo 'PASS: scanner unavailability keeps the app enabled, rejects uploads and recovers'
          [ "$task_av_failed" = 0 ]
      - name: Native core and store antivirus integrity remain clean
