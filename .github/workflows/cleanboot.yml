      # 101 accounts through the planilla's own helper (ensure_user) prove no cap is left. Last on
      # purpose: the accounts are in no planilla, and the divergence gate above would name each.
      - name: Accounts past the 100 an AIO one-click instance allows are created (#176)
        run: |
          cd /opt/aps-conecta/instalador && source scripts/env.sh && source provisioning/lib.sh
          pw="$(od -An -tx1 -N32 /dev/urandom | LC_ALL=C tr -d ' \n')"
          for i in $(seq 101); do
            ensure_user "cuenta-$i" "Cuenta $i" "$pw" \
              || { echo "FAIL: account $i of 101 was refused — the instance still caps its accounts" >&2; exit 1; }
          done
      - name: Prove authenticated egress and internal bypasses
        run: |
          set -euo pipefail
          task_proxy_log="$RUNNER_TEMP/installation-proxy/access.log"
          grep -Eq 'TCP_TUNNEL/200 .*ghcr.io:443 .*fixture' "$task_proxy_log"
          grep -Eq 'TCP_TUNNEL/200 .*(api\.)?github.com:443 .*fixture' "$task_proxy_log"
          if grep -Eq 'TCP_DENIED/403' "$task_proxy_log"; then
            echo "FAIL: an internal request reached the outbound proxy" >&2
            exit 1
          fi
          umask 077
          docker exec --user www-data aps-conecta-nextcloud php occ config:list system > "$RUNNER_TEMP/proxy-client-config.json"
          task_suite_subnet="$(docker network inspect nextcloud-aio --format '{{range .IPAM.Config}}{{println .Subnet}}{{end}}' | head -1)"
          python3 - "$task_suite_subnet" <<'PYCODE'
          import json, os, pathlib, sys
          system = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'proxy-client-config.json').read_text())['system']
          assert system['proxy'] == '***REMOVED SENSITIVE VALUE***', 'proxy credentials are not masked'
          assert sys.argv[1] in system['proxyexclude'], 'actual suite network is not excluded'
          assert 'aps-conecta-nextcloud' in system['proxyexclude'], 'service names are not excluded'
          assert 'nextcloud-aio-harp' in system['proxyexclude'], 'the native AppAPI hostname is not excluded'
          print('PASS: Nextcloud proxy settings are private and exclude the actual suite network')
          PYCODE
          sudo test -s /opt/aps-conecta/proxy.env
          test "$(sudo stat -c %a /opt/aps-conecta/proxy.env)" = 600
          echo "PASS: authenticated registry and GitHub requests used the proxy; internal requests bypassed it"
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=^aps-conecta- --filter name=^nextcloud-aio-mastercontainer$ --format 'table {{.Names}}\t{{.Status}}'
          docker logs --tail=100 nextcloud-aio-mastercontainer || true
          docker logs --tail=100 aps-conecta-apache || true
          docker logs --tail=100 aps-conecta-nextcloud || true
          sudo tail -n 100 /opt/aps-conecta/instalacion.log || true
      # The same scoped teardown as the domain job: the suite's containers, its volumes, the wizard.
      - name: Finish and validate the bounded usage series
        if: always()
        run: python3 scripts/usage.py "$RUNNER_TEMP/usage-series.jsonl" --stop "$RUNNER_TEMP/usage-series.pid"
      - name: Preserve the usage series
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usage-series-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/usage-series.jsonl
          if-no-files-found: error
      - name: Teardown
        if: always()
        run: sudo bash scripts/aio-testbed.sh down
      - name: Stop the installation proxy
        if: always()
        run: sudo squid -f "$RUNNER_TEMP/installation-proxy/squid.conf" -k shutdown || true
