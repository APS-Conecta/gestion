            --output "$task_av_dir/response.xml" "$task_av_chunks_url/.file")"
          if [ "$code" != 415 ] || ! grep -q 'El antivirus rechazó el archivo' "$task_av_dir/response.xml"; then
            echo "FAIL: chunked EICAR returned HTTP $code instead of an antivirus rejection" >&2
            task_av_failed=1
          fi
          code="$(dav --output /dev/null "$task_av_url/antivirus-chunked-eicar-184.txt")"
          if [ "$code" != 404 ]; then
            echo "FAIL: chunked EICAR remains readable (HTTP $code)" >&2
            task_av_failed=1
          fi
          code="$(dav --request DELETE --output /dev/null "$task_av_chunks_url")"
          if [ "$code" != 204 ]; then expect_status 404 "$code" 'chunked EICAR collection cleanup'; fi
          # V1 chunking accepts the sub-limit pieces needed to prove whole-file enforcement.
          code="$(dav --request MKCOL --output "$task_av_dir/response.xml" "$task_av_chunks_url")"
          expect_status 201 "$code" 'oversized assembly collection creation'
          truncate -s 786432 "$task_av_dir/chunk.bin"
          for part in 00001 00002; do
            code="$(dav --upload-file "$task_av_dir/chunk.bin" --output "$task_av_dir/response.xml" "$task_av_chunks_url/$part")"
            expect_status 201 "$code" "oversized assembly chunk $part upload"
          done
          code="$(dav --request MOVE --header "Destination: $task_av_url/antivirus-assembled-184.bin" \
            --header 'OC-Total-Length: 1572864' --output "$task_av_dir/response.xml" "$task_av_chunks_url/.file")"
          task_av_chunks_rejected=1
          if [ "$code" != 415 ] || ! grep -q 'El antivirus rechazó el archivo' "$task_av_dir/response.xml"; then
            echo "FAIL: assembled chunks returned HTTP $code instead of a whole-file rejection" >&2
            task_av_failed=1
            task_av_chunks_rejected=0
          fi
          code="$(dav --output /dev/null "$task_av_url/antivirus-assembled-184.bin")"
          if [ "$code" != 404 ]; then
            echo "FAIL: the assembled upload remains readable (HTTP $code)" >&2
            task_av_failed=1
            task_av_chunks_rejected=0
          fi
          if [ "$task_av_chunks_rejected" = 1 ]; then
            echo 'PASS: individually accepted chunks cannot bypass the complete-file scan limit'
          fi
          # Hold the engine until the running frontend has staged the upload, then interrupt its connection.
          docker exec aps-antivirus-boundary killall -STOP clamd
          printf 'user = "ana.prueba:%s"\n' "$task_av_password" \
            | "${task_av_curl[@]}" --limit-rate 128k --upload-file "$task_av_dir/at-limit.bin" \
                --output "$task_av_dir/midstream.xml" "$task_av_url/antivirus-midstream-184.bin" > "$task_av_dir/midstream.code" &
          task_av_pid=$!
          task_av_staged=0
          task_av_stage_deadline=$((SECONDS + 45))
