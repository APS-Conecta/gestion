          content = (root / 'eicar.txt').read_bytes()
          midpoint = len(content) // 2
          (root / '00001').write_bytes(content[:midpoint])
          (root / '00002').write_bytes(content[midpoint:])
          PYSPLIT
          for part in 00001 00002; do
            code="$(dav --upload-file "$task_av_dir/$part" --output "$task_av_dir/response.xml" "$task_av_chunks_url/$part")"
