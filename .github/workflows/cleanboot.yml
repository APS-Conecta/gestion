          [[ "$code" =~ ^[45][0-9][0-9]$ ]] \
            || { echo "FAIL: an update-only share bypassed safe staging (HTTP $code)" >&2; exit 1; }
          code="$(staff_dav --output "$task_av_dir/download.txt" "$task_av_shared_url/clean.txt")"
          [ "$code" = 200 ] && cmp "$task_av_dir/clean.txt" "$task_av_dir/download.txt"
          code="$(dav --output "$task_av_dir/download.txt" "$task_av_url/$task_av_share_name/clean.txt")"
          [ "$code" = 200 ] && cmp "$task_av_dir/clean.txt" "$task_av_dir/download.txt"
          code="$(dav --upload-file "$task_av_dir/updated.txt" --output "$task_av_dir/response.xml" \
            "$task_av_url/$task_av_share_name/clean.txt")"
