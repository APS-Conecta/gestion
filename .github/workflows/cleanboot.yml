# The full bring-up: install a clinic from nothing and prove it converges. ~3 minutes.
#
# It lives in its own file because GitHub filters paths per WORKFLOW, not per job — the only way to
# run this on the PRs that can break it while the static gate still runs on all of them.
#
# WHY IT RUNS ON PULL REQUESTS (#97). Schedule/dispatch only, it never ran on its own; the first
# dispatch, on 2026-08-01, failed on #96 — a bug already merged to main that this gate would have
# caught on its PR. It cannot be a REQUIRED check (branch protection needs GitHub Pro or a public
# repo), so the red X is advisory — exactly why the trigger matters: visibility is the mechanism.
name: Clean boot

on:
  # Everything a clean install reads. Docs, themes and apps/ are deliberately absent — they cannot
  # change what `make install` builds. sites/** drives the groups, folders and ACL matrix, and
  # .env.example is copied verbatim by the first step below and has broken that step before.
  # dev/** is here because 12-apps SOURCES dev/lab-apps.sh (ADR-0005): the file is inert on a clinic,
  # but a syntax error in it still kills the phase, so it is part of the install path now.
  pull_request:
    paths:
      - 'provisioning/**'
      - 'compose*.yaml'
      - 'Makefile'
      - 'scripts/**'
      - 'sites/**'
      - 'dev/**'
      - '.env.example'
      - '.github/workflows/cleanboot.yml'
  # Kept as the backstop for drift no PR causes. Our own bytes stopped being a source of it — images
  # pinned by digest (#109), apps vendored as committed tarballs (#98) — so what still moves untouched
  # is the runner image and the actions. `image-digests` reports the other half an hour earlier.
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:

# The event is part of the group, so a push can only ever cancel another push. Without it, the
# weekly clean boot and ordinary pushes to main shared one group: merge a PR while Monday's
# bring-up is running and it is cancelled — and a cancelled run is not a failure, so there is no
# notification and no red check. The one job that proves the stack comes up from empty would simply
# have stopped happening, quietly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cleanboot:
    name: Clean boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `make setup` rather than `cp`, so the generator itself is exercised: it is the only place
      # the four secrets are produced, and it cannot be tested on a dev box that already has an env
      # file. A clean runner is the one environment where the create path actually runs.
      - run: make setup
      # No establishment ships, so this is not merely a test of the `--new` path — it IS the install
      # path every operator walks, and this job is where it is proven. Piped answers stand in for the
      # operator's; the appended SITE line wins over anything .env.example says, because env.sh takes
      # the last assignment it reads.
      - name: Choose an establishment, the way an operator would
        run: |
          # A deterministic pick over the register, not a fixed code: every clinic in the register
          # is a valid install, and CI booting the same one every time is a fixture that steers —
          # and names a real clinic in a public log. sha256 over the sorted codes makes the pick
          # stable per register content: it moves only when the register moves, and sites/**
          # already triggers this workflow, so every new snapshot is booted against a fresh pick.
          pick=$(python3 - <<'PY'
          import csv, glob, hashlib, sys
          files = sorted(glob.glob("sites/establecimientos-deis-*.csv"))
          if not files:
              sys.exit("FATAL: no sites/establecimientos-deis-*.csv — nothing to boot against")
          with open(files[-1], encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh))
          if not rows:
              sys.exit("FATAL: the register is empty — refusing to boot a silent green (B-001)")
          codes = sorted(r["codigo"] for r in rows)
          pick = codes[int(hashlib.sha256("\n".join(codes).encode()).hexdigest(), 16) % len(codes)]
          row = next(r for r in rows if r["codigo"] == pick)
          print(pick + "\t" + row["nombre"] + " (" + row["comuna"] + ")")
          PY
          ) || exit 1
          code=${pick%%$'\t'*}
          [ -n "$code" ] || { echo "FATAL: empty register pick" >&2; exit 1; }
          echo "cleanboot: register pick — DEIS $code: ${pick#*$'\t'}"
          # The piped answers are generic by construction — ask() always asks sectors then
          # programs, for every tipo — so they survive the moving pick unchanged.
          printf 'Sector 1\nSector 2\n\nSalud Mental\nInfantil\n\n' | scripts/deis.py "$code" --new ci
          echo "SITE=ci" >> .env
          # Establishment-local roles (#103). deis.py writes SITE_ROLES empty by design — most
          # establishments add nothing beyond the shared registry — so the create path would never
          # execute anywhere if CI did not append one here. One of each kind on purpose: a jefatura,
          # which must ALSO produce a standing account, and a technical role, which must not.
          # Works for any pick: deis.py:217 always writes SITE_ROLES=() for the += to append to.
          cat >> sites/ci/site.sh <<'ROLES'
          SITE_ROLES+=( "role-jefe-sar|Jefe/a de SAR|cat-jefaturas" "role-tens-sar|TENS – SAR|cat-tecnicos" )
          ROLES
      # The whole install, exactly as an operator runs it: `make up` owns the wait for Nextcloud's
      # own installer, and provisioning follows. This is also the path nothing else exercises — so
      # 12-apps unpacks every vendored tarball into an empty apps/ and applies its patches for real,
      # and every query-before-set guard meets a key that does not exist yet.
      # Euro-Office comes up with it since #81 dropped the profile: this job downloads the 2.56 GB
      # documentserver it used to skip and waits out its 120s start_period, and in exchange
      # `make test` below proves a document can be opened, not only that the connector was configured.
      - run: make install
      # Paired with the SITE_ROLES appended above (#103), because "the seed did not crash" is not the
      # same as "the roles landed". Asserts both halves of the rule: a cat-jefaturas role is a
      # POSITION and gets a standing account; a cat-tecnicos one is a job title held by people who
      # arrive with the roster (#106), so it must NOT. The negative is the half that would rot
      # silently — an over-eager loop creating accounts for every local role looks like success.
      - name: Clinic-local roles landed, and only the jefatura got an account
        run: |
          occ() { docker compose exec -T --user www-data nextcloud php occ "$@"; }
          occ group:list | grep -q role-jefe-sar
          occ group:list | grep -q role-tens-sar
          occ user:info jefe.sar > /dev/null
          if occ user:info tens.sar > /dev/null 2>&1; then
            echo "FAIL: tens.sar exists — a cat-tecnicos role must not create a standing account" >&2
            exit 1
          fi
      # The only place a first AND a second seed both exist. Idempotency is the pipeline's defining
      # property (AD-2) and nothing else asserts it: a warm dev box cannot tell "already correct"
      # from "silently did nothing", because on a warm box those are the same thing.
      - run: make seed-idempotent
      - run: make test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      # `make install` prints phase names and sends the detail to .install.log, so without this the
      # one job that exists to catch a broken install cannot show what broke — #96 was diagnosed only
      # after adding it. include-hidden-files because .install.log is a dotfile and upload-artifact@v4
      # skips those by default, which silently uploaded nothing on the first attempt.
      - name: Provisioning log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: .install.log
          include-hidden-files: true
          if-no-files-found: warn
