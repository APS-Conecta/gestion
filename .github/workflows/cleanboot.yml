      - name: Staff can read the imported comuna fixtures through Territorio
        run: |
          set -euo pipefail
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          cut="$(. "$RUNNER_TEMP/site.sh" && printf '%s' "$SITE_COMUNA_CUT")"
          sudo python3 - "https://$SUITE_IP" "$RUNNER_TEMP/ca.crt" "$cut" <<'PYPLACES'
          import base64, csv, http.cookiejar, json, ssl, sys, urllib.request

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          stage = 'reading the fixture expectations and protected staff credentials'
          try:
              with open('tests/fixtures/comuna/expected-v1.json', encoding='utf-8') as stream:
                  expected = json.load(stream)[sys.argv[3]]
              assert expected['establishment'] is not None
              with open('/opt/aps-conecta/credentials.txt', encoding='utf-8', newline='') as stream:
                  matches = [row for row in csv.reader(stream, delimiter=';')
                             if len(row) > 2 and row[0] == 'beto.prueba']
              assert len(matches) == 1 and matches[0][2]
              authorization = base64.b64encode(('beto.prueba:' + matches[0][2]).encode()).decode('ascii')
              opener = urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=sys.argv[2])),
                  urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()), RejectRedirects())

              def get(path):
                  request = urllib.request.Request(sys.argv[1] + path, headers={
                      'Authorization': 'Basic ' + authorization, 'OCS-APIRequest': 'true',
                      'Accept': 'application/json'})
                  with opener.open(request, timeout=30) as response:
                      assert response.status == 200
                      return json.load(response)

              stage = 'reading the exact published establishment'
              establishment = expected['establishment']
              result = get('/ocs/v2.php/apps/territorio/api/v1/subcategories/salud/'
                           + establishment['subcategory'] + '/features?format=json')['ocs']
              assert result['meta']['status'] == 'ok'
              found = [feature for feature in result['data'] if feature['name'] == establishment['name']]
              assert len(found) == 1
              assert found[0]['geometry'] == {'type': 'Point', 'coordinates': establishment['coordinates']}

              stage = 'reading the exact published area'
              area = expected['uv']
              result = get('/ocs/v2.php/apps/territorio/api/v1/subcategories/'
                           'division_territorial/unidad_vecinal/features?format=json')['ocs']
              assert result['meta']['status'] == 'ok'
              found = [feature for feature in result['data'] if feature['name'] == area['name']]
              assert len(found) == 1 and found[0]['geometry']['type'] in ('Polygon', 'MultiPolygon')
              points = []

              def collect(value):
                  if isinstance(value[0], (int, float)):
                      points.append(value[:2])
                  else:
                      for item in value:
                          collect(item)

              collect(found[0]['geometry']['coordinates'])
              assert [min(p[0] for p in points), min(p[1] for p in points),
                      max(p[0] for p in points), max(p[1] for p in points)] == area['bounds']
          except Exception as error:
              raise SystemExit(f'FAIL: {stage} ({type(error).__name__})') from None
          print('PASS: ordinary staff sees the published establishment and area with their source coordinates')
          PYPLACES
          sudo aps-conecta datos --importar > "$RUNNER_TEMP/data-reimport.out" 2>&1
          cat "$RUNNER_TEMP/data-reimport.out"
          [ "$(grep -c 'Importado a ".*": 0 creados,' "$RUNNER_TEMP/data-reimport.out")" -eq 2 ] \
            || { echo 'FAIL: the second import did not preserve both existing fixture records' >&2; exit 1; }
