                  removed = False
                  account_created = False
                  failure = None

                  def dav(method, target, data=None, headers=None):
                      methods.append(method)
                      request = urllib.request.Request(target, data=data, method=method,
                          headers={'Authorization': authorization, **(headers or {})})
                      try:
                          response = opener.open(request, timeout=45)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          return response.status, response.read()

                  try:
                      occ('user:add', '--password-from-env', *groups,
                          '--display-name=Prueba de carga inicial', user, password=password)
                      account_created = True
                      stage = 'the first WebDAV PUT into ' + folder['mountPoint']
                      status, _ = dav('PUT', url, marker, {'Content-Type': 'text/plain'})
                      assert methods == ['PUT']
                      assert status == expected, f'first PUT returned {status}, expected {expected}'
                      if expected == 201:
                          stage = 'reading the exact uploaded bytes'
                          status, saved = dav('GET', url)
                          assert status == 200 and saved == marker
                          stage = 'removing the owned upload'
                          status, _ = dav('DELETE', url)
                          assert status == 204
                      else:
                          stage = 'checking that the denied upload is absent'
                          status, _ = dav('GET', url)
                          assert status == 404
                      removed = True
                  except Exception as error:
                      failure = str(error)
                  finally:
                      try:
                          if account_created and not removed:
                              if expected != 201:
                                  occ('group:adduser', writer, user)
                              status, _ = dav('PROPFIND', base, headers={'Depth': '1'})
                              assert status == 207
                              status, saved = dav('GET', url)
                              if status == 200:
                                  assert saved == marker
                                  status, _ = dav('DELETE', url)
                                  assert status == 204
                              else:
                                  assert status == 404
                      except Exception:
                          failure = (failure + '; ' if failure else '') + 'owned upload cleanup failed'
                      finally:
                          try:
                              if account_created or user in json.loads(occ('user:list', '--output=json', '--limit=0')):
                                  occ('user:delete', user)
                          except Exception:
                              failure = (failure + '; ' if failure else '') + 'owned account cleanup failed'
                  if failure:
                      raise RuntimeError(failure)
                  print(f'PASS: first PUT returns {expected} in ' + folder['mountPoint'] + '; result verified and owned fixtures removed')
          except Exception as error:
              raise SystemExit(f'FAIL: {stage} ({error})') from None
          PYNESTED
