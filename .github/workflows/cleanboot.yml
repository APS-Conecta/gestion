          [ "$(occ config:app:get estadistica installed_version)" = "$ever" ] \
            || { echo "FAIL: the weekly run moved estadistica off its locked $ever" >&2; exit 1; }
          read -r ttag tver _tsha <<< "$(sudo python3 -c 'import json; a = json.load(open("/opt/aps-conecta/apps.lock.json"))["apps"]["totem"]; print(a["tag"], a["version"], a["sha256"])')"
