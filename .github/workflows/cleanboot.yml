          app: estadistica
      - name: Estadística's DEIS data import runs — the job contacted DEIS and imported its register (#40)
        run: |
          set -euo pipefail
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          occ background-job:list --class 'OCA\Estadistica\BackgroundJob\RemJob' --output=json \
            | python3 -c 'import json, sys; print(json.dumps([{k: row[k] for k in ("id", "class", "last_run")} for row in json.load(sys.stdin)]))'
          # cron ticks every 5 min; the job runs on the first tick after enable. The bound is the
          # family's own (the store-off reboot's 10 min): enough for two ticks.
          chequeo=""
          for i in $(seq 60); do
            chequeo="$(occ config:app:get estadistica deis_checked_at 2>/dev/null || true)"
            [ -n "$chequeo" ] && { echo "deis_checked_at set (attempt $i)"; break; }
            sleep 10
          done
          [ -n "$chequeo" ] \
            || { echo "FAIL: estadistica's DEIS job never ran within 10 min of the install — deis_checked_at is empty; the app is installed, so its hourly job (cron.php, every 5 min) should have checked DEIS. " >&2; exit 1; }
          # The Base de Establecimientos is the import's first landing: a real DEIS database file
          # (~1 MB) read, imported and recorded. Empty here with a set checked_at means the check
          # ran but could not reach DEIS — said loudly, never waved through.
          registro="$(occ config:app:get estadistica deis_register 2>/dev/null || true)"
          [ -n "$registro" ] \
            || { echo "FAIL: deis_checked_at is set ($chequeo) but deis_register is empty — the DEIS check ran without importing the Base de Establecimientos; the runner may not reach repositoriodeis.minsal.cl (see deis_check_errors: $(occ config:app:get estadistica deis_check_errors 2>/dev/null || true))" >&2; exit 1; }
          echo "estadística: la importación del DEIS corre — contacto registrado, Base de Establecimientos importada, la ventana REM queda en cola"
      # #147: a dependency outage must not disable an installed connector. Waiting for
      # fresh Nextcloud health proves its entrypoint finished the bounded wait, so an
      # enabled check cannot pass early while startup is still waiting for the server.
      - name: A late DocumentServer keeps its app enabled and converges on the next start
        run: |
          set -euo pipefail
          cd /opt/aps-conecta/instalador && source scripts/env.sh
          wait_healthy() {
            local container="$1"
            for attempt in $(seq 120); do
              if [ "$(docker inspect "$container" --format '{{.State.Health.Status}}' 2>/dev/null)" = healthy ]; then
                return 0
              fi
              sleep 3
            done
            echo "FAIL: $container did not become healthy within six minutes" >&2
            return 1
          }
          [ "$(occ config:app:get eurooffice enabled)" = yes ]
          marker=https://office-wait.invalid/deferred
          occ config:app:set eurooffice DocumentServerUrl --value "$marker" >/dev/null
          trap 'docker start aps-conecta-eurooffice >/dev/null 2>&1 || true' EXIT
          docker stop --time 10 aps-conecta-eurooffice >/dev/null
          task_theme_css_before="$(docker exec aps-conecta-nextcloud sha256sum /var/www/html/themes/apsconecta/core/css/site.css)"
          printf '%s\n' '{"translations":{},"pluralForm":"nplurals=2; plural=(n != 1);"}' \
