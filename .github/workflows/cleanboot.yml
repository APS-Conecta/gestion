                  body = response.read()
                  success = path.endswith('/success.txt')
                  assert response.status == (201 if success else 500), (method, path, response.status)
                  assert response.headers['X-Request-ID'] == 'fixture-184'
                  assert int(response.headers['Content-Length']) == len(body)
                  if translated:
                      assert response.headers['Content-Type'] == 'application/xml; charset=utf-8'
                      assert response.headers.get('Content-Encoding') is None
