          docker restart aps-conecta-nextcloud >/dev/null
          wait_healthy aps-conecta-nextcloud
          docker exec aps-conecta-nextcloud cmp /usr/src/nextcloud/themes/apsconecta/custom_apps/files_antivirus/l10n/es.json \
