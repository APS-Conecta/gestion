            [ "$bytes" -gt 1000000 ] \
              || { echo "FAIL: the $voz voice answered $bytes bytes — the display cannot load its voice" >&2; exit 1; }
          done
          echo "totem: instalada desde su release, con sus dos voces servidas al display"
