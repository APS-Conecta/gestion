          expect_status 201 "$code" 'at-limit assembly collection creation'
          printf 'Assembled clean overwrite.\n' > "$task_av_dir/chunk.bin"
          truncate -s 524288 "$task_av_dir/chunk.bin"
          cat "$task_av_dir/chunk.bin" "$task_av_dir/chunk.bin" > "$task_av_dir/assembled.bin"
          for part in 00001 00002; do
            code="$(dav --upload-file "$task_av_dir/chunk.bin" --output "$task_av_dir/response.xml" "$task_av_chunks_url/$part")"
            expect_status 201 "$code" "at-limit assembly chunk $part upload"
          done
          code="$(dav --request MOVE --header "Destination: $task_av_url/antivirus-at-limit-184.bin" \
            --header 'OC-Total-Length: 1048576' --output "$task_av_dir/response.xml" "$task_av_chunks_url/.file")"
