          python3 - "$task_ingress_dir" "$task_ingress_port" <<'PYRESPONSES'
          import gzip, pathlib, sys, urllib.error, urllib.request, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          cases = [
              ('PUT', '/remote.php/dav/files/staff/error.txt', True),
              ('MOVE', '/remote.php/dav/uploads/staff/chunks/.file', True),
              ('PUT', '/remote.php/webdav/error.txt', True),
