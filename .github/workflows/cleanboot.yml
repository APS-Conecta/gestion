            --output "$task_av_dir/share.json" "$task_av_shares_url?format=json")"
          [ "$code" = 200 ] || [ "$code" = 201 ]
          task_av_share_id="$(python3 - "$task_av_dir/share.json" <<'PYSHARE'
          import json, pathlib, sys
          response = json.loads(pathlib.Path(sys.argv[1]).read_text())['ocs']
          assert response['meta']['statuscode'] in (100, 200)
          assert int(response['data']['permissions']) == 3
          print(response['data']['id'])
          PYSHARE
          )"
          [[ "$task_av_share_id" =~ ^[1-9][0-9]*$ ]]
          task_av_shared_path="$(python3 - "$task_av_dir/share.json" <<'PYSHAREPATH'
          import json, pathlib, sys, urllib.parse
          share = json.loads(pathlib.Path(sys.argv[1]).read_text())['ocs']['data']
          print(urllib.parse.quote(share['file_target'].lstrip('/'), safe='/'))
          PYSHAREPATH
          )"
          task_av_shared_url="https://$SUITE_IP/remote.php/dav/files/beto.prueba/$task_av_shared_path"
          for target in parent file; do
            task_av_probe_url="$task_av_shared_url"
            if [ "$target" = file ]; then task_av_probe_url="$task_av_probe_url/clean.txt"; fi
            code="$(staff_dav --request PROPFIND --header 'Depth: 0' --header 'Content-Type: application/xml' \
              --data '<d:propfind xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns"><d:prop><oc:permissions/></d:prop></d:propfind>' \
              --output "$task_av_dir/$target-permissions.xml" "$task_av_probe_url")"
            [ "$code" = 207 ]
          done
          python3 - "$task_av_dir" <<'PYPERMISSIONS'
          import pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          def permissions(name):
              values = ET.parse(root / f'{name}-permissions.xml').findall('.//{http://owncloud.org/ns}permissions')
              assert len(values) == 1
              return values[0].text or ''
          assert 'W' in permissions('file'), 'the shared file must permit UPDATE'
          parent = permissions('parent')
          assert 'C' not in parent and 'K' not in parent, 'the shared parent must deny CREATE'
          PYPERMISSIONS
          code="$(staff_dav --output "$task_av_dir/download.txt" "$task_av_shared_url/clean.txt")"
          [ "$code" = 200 ] && cmp "$task_av_dir/clean.txt" "$task_av_dir/download.txt"
          code="$(staff_dav --upload-file "$task_av_dir/updated.txt" --output "$task_av_dir/response.xml" \
