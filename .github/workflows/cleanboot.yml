      # The weekly run, by IP, on the instance just installed: the leaf is kept (same fingerprint) and
      # apache is not restarted; the seed converges again, idempotent by IP too. #33 adds its half:
      # the same run downloads nothing and leaves the lock unchanged.
      - name: The weekly run keeps the leaf and apache as they are, downloads nothing and keeps the lock
        run: |
          set -o pipefail
          leaf=/opt/aps-conecta/certificados/suite/tls.crt
          lock=/opt/aps-conecta/apps.lock.json
          antes="$(sudo sha256sum "$leaf")"; lock_antes="$(sudo sha256sum "$lock" | cut -d' ' -f1)"
