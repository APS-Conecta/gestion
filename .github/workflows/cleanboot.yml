      # job chose it, and the DEIS data import RUNNING: the app's own hourly job is what downloads
      # the figures (ADR-0005 in that repo — the installer moves no data), so the assertion is the
      # job's own observable state, not a table: after cron's first tick (the suite's nextcloud runs
      # cron every 5 min) deis_checked_at records the first DEIS contact and deis_register the Base
      # de Establecimientos it imported — real DEIS bytes landed, and the window's members are
      # queued for the ticks that follow.
      - name: Estadística installed from its release because it was chosen, and its DEIS import runs (#40)
        run: |
          set -euo pipefail
          grep -q "estadistica=1" /opt/aps-conecta/aio/opciones \
            || { echo "FAIL: the wizard's options record does not name estadistica=1 — the choice the install was given" >&2; cat /opt/aps-conecta/aio/opciones >&2; exit 1; }
