name: Debian candidate acceptance
on:
  workflow_dispatch:
    inputs:
      suite-tag:
        description: Unpublished rehearsal images to install inside Debian 12
        type: string
        required: true
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and rerun the suite in a disposable Debian 12 VM
        env:
          SUITE_TAG: ${{ inputs.suite-tag }}
        run: bash tests/debian-vm-acceptance.sh "$SUITE_TAG"
      - name: Preserve environment and acceptance verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debian-acceptance/evidence/
          if-no-files-found: warn
