# The clean-machine acceptance harness (Seam 1, aps/acceptance/run.sh): a published candidate's Bootstrap on a fresh
# Debian 12 VM, exactly as the manual prints it, then every check module in aps/acceptance/checks/, each reported on
# its own. It tests the candidate's release, never this tree; the harness and its checks come from the ref it runs on.
#
# It runs on a maintainer's dispatch for a pre-release, and from another workflow through workflow_call. A pull
# request that touches our images or the Bootstrap gets it on demand: publish the pull request's test build
# (aps/RELEASING.md, section 3), then dispatch this workflow for that tag:
#
#   gh workflow run acceptance.yml --repo APS-Conecta/gestion -f tag=v0.0.0-ci.N
#
# A pull request that changes the harness itself dispatches it with `--ref <its branch>`.
name: Acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The pre-release to install, such as v0.0.0-ci.N
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  clean-machine:
    name: The candidate's Bootstrap on a fresh Debian 12 VM, then every check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free unused disk on the runner for the VM
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          df -h /
      - name: Install the VM tools and the browser driver (Playwright with Chromium)
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y qemu-system-x86 qemu-utils cloud-image-utils dnsmasq-base python3-venv \
            libnss3-tools > /dev/null
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install --quiet playwright==1.64.1
          "$RUNNER_TEMP/browser/bin/playwright" install --with-deps chromium > /dev/null
          echo "$RUNNER_TEMP/browser/bin" >> "$GITHUB_PATH"
      - name: Run the candidate's Bootstrap on the VM, then every check
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: aps/acceptance/run.sh "$TAG"
      - name: Attach the evidence (each failing check's container logs and disk usage)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence
          path: ${{ runner.temp }}/acceptance/evidence
