# Serves the Protomaps basemap archive, and nothing else.
#
# PMTiles is read by the BROWSER with HTTP Range requests: the client asks for the
# few byte ranges holding the tiles it is drawing, never the whole file. Measured on
# `chile.pmtiles` (1.04 GB): ~550-950 KB per screenful, 2.3 MB to work a whole comuna
# across three zoom levels — a ratio of about 1:460. So this is a plain static file
# server that honours ranges, which nginx does on its own, and NOT a tile server.
server {
    listen 80;
    root /srv/tiles;

    # Every header lives here, at server level, and no `location` below adds one.
    # That is deliberate: in nginx an `add_header` inside a location DISCARDS every
    # add_header inherited from the server block, so adding a single Cache-Control
    # down there would silently drop all three CORS headers and leave a blank
    # basemap with nothing in the network tab looking wrong.
    #
    # The map page is served on a different port, so every tile read is cross-origin.
    add_header Access-Control-Allow-Origin   "*"     always;
    add_header Access-Control-Allow-Headers  "Range" always;
    # The pmtiles reader has to SEE the range headers it asked about, and a
    # cross-origin response exposes none of them by default.
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;
    # One archive, replaced whole by the re-extract. Revalidation means a browser
    # re-reads ranges from its own copy until the ETag changes, which is what makes
    # panning inside an already-loaded comuna cost nothing.
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;

    # nginx sets Accept-Ranges itself for static files; saying it again would be a
    # second header, not a louder one.

    location / {
        # A cross-origin Range request is preflighted.
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }
}
